<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Ledger</title>
<meta name="theme-color" content="#0B6E4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<!-- Chart.js and PapaParse are vendored locally in vendor/ rather than loaded from a CDN,
     so a compromised or tampered third-party file can't run inside an app that holds your
     bank transaction data. Keep these in sync if you ever bump versions. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/papaparse.min.js"></script>
<script src="js/money.js"></script>
<script src="js/rules.js"></script>
<script src="js/storage.js"></script>
<script src="js/model.js"></script>
<script src="js/investments.js"></script>
<script src="js/import.js"></script>
<script src="js/reports.js"></script>
<script src="js/ui.js"></script>
<script src="js/diagnostics.js"></script>
<script src="js/transfers.js"></script>
<script src="js/reconciliation.js"></script>
<script src="js/views/net-worth.js"></script>
<script src="js/views/accounts.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="lock-screen" class="lock-screen hidden">
  <div class="lock-card">
    <h2>Pocket Ledger</h2>
    <p id="lock-card-sub">Enter your PIN to continue</p>
    <input type="password" inputmode="numeric" autocomplete="off" class="lock-pin-input" id="lock-pin-input" maxlength="12" placeholder="••••">
    <div class="lock-error" id="lock-error"></div>
    <button class="btn btn-primary" id="lock-unlock-btn">Unlock</button>
    <button class="btn-link" id="lock-forgot-btn">Forgot PIN? Remove app lock</button>
  </div>
</div>

<div id="storage-warning" class="hidden">
  <div class="storage-warning-inner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="flex-shrink:0;"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span id="storage-warning-text"></span>
    <button id="storage-warning-dismiss" title="Dismiss for now">&times;</button>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">£</div>
      <div>
        <div class="brand-text">Pocket Ledger</div>
        <div class="brand-sub">Money, tracked</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-tab="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span class="lbl">Dashboard</span>
      </button>
      <button class="nav-item" data-tab="transactions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
        <span class="lbl">Transactions</span>
        <span class="nav-badge hidden" id="uncat-badge">0</span>
      </button>
      <button class="nav-item" data-tab="reconcile" aria-label="Reconcile accounts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h10M4 17h7"/><path d="m16 16 2 2 4-5"/></svg>
        <span class="lbl">Reconcile</span>
      </button>
      <button class="nav-item" data-tab="health" aria-label="Review data health">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v5c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-3Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>
        <span class="lbl">Data Health</span>
      </button>
      <button class="nav-item" data-tab="import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <span class="lbl">Import</span>
      </button>
      <button class="nav-item" data-tab="categories">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 12.6 12.6 20.6a2 2 0 0 1-2.8 0l-8-8a2 2 0 0 1 0-2.8L9.8 1.8a2 2 0 0 1 1.4-.6H18a2 2 0 0 1 2 2v6.4a2 2 0 0 1-.6 1.4Z"/><circle cx="15.5" cy="6.5" r="1.5"/></svg>
        <span class="lbl">Categories</span>
      </button>
      <button class="nav-item" data-tab="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/></svg>
        <span class="lbl">Spending Plan</span>
      </button>
      <button class="nav-item" data-tab="investments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
        <span class="lbl">Investments</span>
      </button>
      <button class="nav-item" data-tab="networth">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/><path d="m3 7 6-5 6 7 6-5"/></svg>
        <span class="lbl">Net Worth</span>
      </button>
      <button class="nav-item" data-tab="insights">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="lbl">Insights</span>
      </button>
    </nav>
    <div class="sidebar-foot">
      <div class="balance-chip">
        <div class="lbl">Available cash</div>
        <div class="val num" id="sidebar-balance">£0.00</div>
      </div>
      <div class="icon-btn-row">
        <button class="icon-btn" id="btn-theme-toggle" title="Switch theme" aria-label="Switch colour theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Open settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
        <button class="icon-btn" id="btn-export" title="Export backup" aria-label="Export backup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="page-title" id="page-title">Dashboard</div>
        <div class="page-sub" id="page-sub">All figures update automatically from your transactions.</div>
      </div>
      <div id="topbar-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="modal-host"></div>
<div id="toast-host" aria-live="polite" aria-atomic="true"></div>

<script src="js/app.js"></script>
<script src="js/device.js"></script>
<script src="js/recurring.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/reconcile.js"></script>
<script src="js/views/health.js"></script>
<script src="js/views/transactions.js"></script>
<script src="js/views/plan.js"></script>
<script src="js/views/investments.js"></script>
<script src="js/views/insights.js"></script>
<script src="js/views/categories.js"></script>
<script src="js/views/import.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/start.js"></script>
</body>
</html>
