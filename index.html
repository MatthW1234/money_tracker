// Lays out one column of Sankey nodes stacked to fill availH, guaranteeing
// every node at least minNodeH regardless of its value — otherwise a long
// tail of small buckets gets squeezed into a few px and their labels pile up
// on top of each other. Nodes needing the floor take it; whatever height
// remains is distributed proportionally among the rest.
function layoutSankeyColumn(buckets, availH, gap, minNodeH){
  const total = buckets.reduce((s,b)=>s+b.value,0);
  if(!total || !buckets.length) return [];
  const totalGap = gap*(buckets.length-1);
  const forNodes = Math.max(0, availH - totalGap);
  const heights = new Array(buckets.length).fill(0);
  const floored = new Set();
  for(let pass=0; pass<buckets.length+1; pass++){
    const remainingValue = buckets.reduce((s,b,i)=> floored.has(i) ? s : s+b.value, 0);
    const remainingH = Math.max(0, forNodes - floored.size*minNodeH);
    let newlyFloored = false;
    buckets.forEach((b,i)=>{
      if(floored.has(i)){ heights[i] = minNodeH; return; }
      const h = remainingValue>0 ? b.value/remainingValue*remainingH : 0;
      if(h < minNodeH){ floored.add(i); heights[i] = minNodeH; newlyFloored = true; }
      else heights[i] = h;
    });
    if(!newlyFloored) break;
  }
  let cursor = 0;
  return buckets.map((b,i)=>{
    const node = Object.assign({}, b, {y:cursor, h:heights[i]});
    cursor += heights[i] + gap;
    return node;
  });
}
function drawCashFlowChart(list, income){
  const host = document.getElementById('cashflow-sankey');
  const warningHost = document.getElementById('cashflow-warning');
  if(!host) return;
  if(warningHost) warningHost.innerHTML = '';

  const byIncomeCat = {};
  const byExpenseCat = {};
  expandSplits(list).forEach(t=>{
    if(!countsTowardTotals(t)) return;
    if(t.amount>0){ const k=t.category||'Uncategorised'; byIncomeCat[k]=(byIncomeCat[k]||0)+t.amount; }
    else if(t.amount<0){ const k=t.category||'Uncategorised'; byExpenseCat[k]=(byExpenseCat[k]||0)+Math.abs(t.amount); }
  });

  const incomeSorted = Object.entries(byIncomeCat).sort((a,b)=> b[1]-a[1]);
  const incomeTop = incomeSorted.slice(0,5);
  const incomeOtherSum = incomeSorted.slice(5).reduce((s,e)=>s+e[1],0);

  const expenseSorted = Object.entries(byExpenseCat).sort((a,b)=> b[1]-a[1]);
  const expenseTop = expenseSorted.slice(0,5);
  const expenseOtherSum = expenseSorted.slice(5).reduce((s,e)=> s+e[1], 0);
  const totalExpense = expenseSorted.reduce((s,e)=> s+e[1], 0);
  const net = income - totalExpense;

  if(income<=0 && !expenseTop.length){
    host.innerHTML = `<div class="empty-state" style="padding:30px 10px;"><h4>No cash flow yet</h4><p style="font-size:12.5px;">Income and spending for this period will appear here.</p></div>`;
    return;
  }

  const incomeBuckets = incomeTop.map(([name,amt],i)=> ({label:name, value:amt, color:getDonutColors()[i%getDonutColors().length]})).filter(b=>b.value>0.005);
  if(incomeOtherSum>0.005) incomeBuckets.push({label:'Other income', value:incomeOtherSum, color:cssVar('--ink-faint')});

  const expenseBuckets = expenseTop.map(([name,amt],i)=> ({label:name, value:amt, color:getDonutColors()[i%getDonutColors().length]})).filter(b=>b.value>0.005);
  if(expenseOtherSum>0.005) expenseBuckets.push({label:'Other', value:expenseOtherSum, color:cssVar('--ink-faint')});
  if(net>0.005) expenseBuckets.push({label:'Net (saved)', value:net, color:cssVar('--income')});

  if(!incomeBuckets.length || !expenseBuckets.length){
    host.innerHTML = `<div class="empty-state" style="padding:30px 10px;"><h4>No cash flow yet</h4><p style="font-size:12.5px;">Income and spending for this period will appear here.</p></div>`;
    return;
  }

  const W = 920, H = 440;
  const padTop = 38, nodeW = 14, gap = 12, minNodeH = 30;
  const col0X = 130, col1X = 440, col2X = 750;
  const usableH = H - padTop*2;

  const leftNodes = layoutSankeyColumn(incomeBuckets, usableH, gap, minNodeH);
  const rightNodes = layoutSankeyColumn(expenseBuckets, usableH, gap, minNodeH);
  // The two side columns space their nodes apart with a gap; the middle
  // "Income" bar is a single continuous rect, so where each ribbon actually
  // attaches to it has to be packed with no gaps between segments. That
  // gapped-vs-packed mismatch is what makes the ribbons visibly diverge and
  // flow rather than run flat — without it, a ribbon whose source and target
  // happen to share the same proportional slot ends up perfectly horizontal.
  function packNoGap(nodes){
    let cursor = 0;
    return nodes.map(n=>{ const p = {y:cursor, h:n.h}; cursor += n.h; return p; });
  }
  const leftAttach = packNoGap(leftNodes);
  const rightAttach = packNoGap(rightNodes);
  const leftPackedTotal = leftAttach.length ? leftAttach[leftAttach.length-1].y + leftAttach[leftAttach.length-1].h : 0;
  const rightPackedTotal = rightAttach.length ? rightAttach[rightAttach.length-1].y + rightAttach[rightAttach.length-1].h : 0;
  const midH = Math.max(leftPackedTotal, rightPackedTotal);
  const opacity = isDarkMode() ? 0.4 : 0.28;

  host.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;" preserveAspectRatio="xMidYMid meet">
      ${leftNodes.map((n,i)=> `<path d="${sankeyRibbonPath(col0X+nodeW, padTop+n.y, n.h, col1X, padTop+leftAttach[i].y, leftAttach[i].h)}" fill="${n.color}" opacity="${opacity}"></path>`).join('')}
      ${rightNodes.map((n,i)=> `<path d="${sankeyRibbonPath(col1X+nodeW, padTop+rightAttach[i].y, rightAttach[i].h, col2X, padTop+n.y, n.h)}" fill="${n.color}" opacity="${opacity}"></path>`).join('')}
      ${leftNodes.map(n=> `
        <rect x="${col0X}" y="${padTop+n.y}" width="${nodeW}" height="${n.h}" rx="3" fill="${n.color}"></rect>
        <text x="${col0X-8}" y="${padTop+n.y+n.h/2-4}" text-anchor="end" font-size="13" font-weight="600" fill="var(--ink)">${escHTML(n.label)}</text>
        <text x="${col0X-8}" y="${padTop+n.y+n.h/2+13}" text-anchor="end" font-size="12" fill="var(--ink-faint)">${escHTML(gbp(n.value))}</text>
      `).join('')}
      <rect x="${col1X}" y="${padTop}" width="${nodeW}" height="${midH}" rx="3" fill="var(--ink)"></rect>
      <text x="${col1X+nodeW/2}" y="${padTop-20}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">Income</text>
      <text x="${col1X+nodeW/2}" y="${padTop-6}" text-anchor="middle" font-size="12" fill="var(--ink-faint)">${escHTML(gbp(income))}</text>
      ${rightNodes.map(n=> `
        <rect x="${col2X}" y="${padTop+n.y}" width="${nodeW}" height="${n.h}" rx="3" fill="${n.color}"></rect>
        <text x="${col2X+nodeW+10}" y="${padTop+n.y+n.h/2-4}" font-size="13" font-weight="600" fill="var(--ink)">${escHTML(n.label)}</text>
        <text x="${col2X+nodeW+10}" y="${padTop+n.y+n.h/2+13}" font-size="12" fill="var(--ink-faint)">${escHTML(gbp(n.value))}</text>
      `).join('')}
    </svg>
  `;
  if(warningHost && net<-0.005){
    warningHost.innerHTML = `<p style="font-size:11.5px;color:var(--expense);font-weight:600;margin:8px 2px 0;">Spending exceeded income this period by ${gbp(Math.abs(net))} — a diagram can't show a negative flow, so that shortfall isn't pictured above.</p>`;
  }
}

// Chart.js draws to a <canvas>, which — unlike CSS or SVG — can't resolve
// var(--x) references, so colours handed to it have to be literal strings.
// cssVar() reads the current resolved value of a CSS custom property so
// chart colours stay in sync with the active theme; hexToRgba() derives a
// translucent fill from the same source instead of hardcoding a second,
// separate colour that could drift out of sync with it.
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function hexToRgba(hex, alpha){
  hex = (hex||'').trim().replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r = parseInt(hex.slice(0,2),16)||0, g = parseInt(hex.slice(2,4),16)||0, b = parseInt(hex.slice(4,6),16)||0;
  return `rgba(${r},${g},${b},${alpha})`;
}
function chartGridColor(){ return isDarkMode() ? 'rgba(255,255,255,.08)' : '#E7EBE3'; }
function chartTickColor(){ return cssVar('--ink-faint'); }
const DONUT_COLORS = ['#0B6E4F','#A9791F','#B3392E','#2563EB','#7C3AED','#0D9488','#C2410C','#4B5563','#DB2777','#65A30D'];
const DONUT_COLORS_DARK = ['#2FBE8A','#E3AC4E','#F17164','#6699FF','#A78BFA','#2DD4BF','#F0975A','#9CA8A1','#F472B6','#A3D977'];
function getDonutColors(){ return isDarkMode() ? DONUT_COLORS_DARK : DONUT_COLORS; }
function drawDonutChart(list, chartKey, canvasId, legendId, emptyTitle, emptyDesc){
  const byCat = {};
  expandSplits(list).forEach(t=>{ if(t.amount<0 && countsTowardTotals(t)){ const k=t.category||'Uncategorised'; byCat[k]=(byCat[k]||0)+Math.abs(t.amount); } });
  let entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  if(entries.length>8){
    const top = entries.slice(0,7);
    const rest = entries.slice(7).reduce((s,e)=>s+e[1],0);
    entries = [...top, ['Other', rest]];
  }
  const total = entries.reduce((s,e)=>s+e[1],0);
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  if(UI.charts[chartKey]) UI.charts[chartKey].destroy();
  const legendEl = document.getElementById(legendId);
  if(!entries.length){
    ctx.parentElement.innerHTML = `<div class="empty-state" style="padding:30px 10px;"><h4>${emptyTitle}</h4><p style="font-size:12.5px;">${emptyDesc}</p></div>`;
    if(legendEl) legendEl.innerHTML='';
    return;
  }
  UI.charts[chartKey] = new Chart(ctx, {
    type:'doughnut',
    data:{ labels:entries.map(e=>e[0]), datasets:[{ data:entries.map(e=>e[1]), backgroundColor:getDonutColors(), borderWidth:2, borderColor:cssVar('--surface') }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:(ctx)=> ` ${ctx.label}: ${gbp(ctx.parsed)}`}} } }
  });
  if(legendEl){
    legendEl.innerHTML = entries.map((e,i)=>{
      const pct = total? Math.round(e[1]/total*100) : 0;
      return `<div class="legend-row"><span class="legend-dot" style="background:${getDonutColors()[i%getDonutColors().length]}"></span><span class="legend-name">${escHTML(e[0])}</span><span class="legend-amt num">${gbp(e[1])}</span><span class="legend-pct">${pct}%</span></div>`;
    }).join('');
  }
}

function transactionStatus(t){ return ['pending','cleared','reconciled'].includes(t.status) ? t.status : 'cleared'; }
function statusLabel(status){ return status==='reconciled' ? 'Reconciled' : (status==='pending' ? 'Pending' : 'Cleared'); }
function statusPillHTML(status){
  status = ['pending','cleared','reconciled'].includes(status) ? status : 'cleared';
  return `<span class="status-pill status-${status}">${statusLabel(status)}</span>`;
}
function accountOpeningBalance(account){
  const record=accountRecordFor(account);
  if(record) return Number(record.openingBalance)||0;
  if(Object.prototype.hasOwnProperty.call(DB.accountStartingBalances, account)) return Number(DB.accountStartingBalances[account]) || 0;
  return DB.accounts[0]===account ? (Number(DB.startingBalance)||0) : 0;
}
function accountTransactionsTo(account, date){
  return DB.transactions.filter(t=>t.account===account && t.date<=date).sort((a,b)=>a.date.localeCompare(b.date) || a.description.localeCompare(b.description));
}
function clearedAccountBalance(account, date){
  return accountOpeningBalance(account) + accountTransactionsTo(account,date)
    .filter(t=>transactionStatus(t)!=='pending')
    .reduce((sum,t)=>sum+Number(t.amount||0),0);
}
function reconciliationHistory(account){
  const rec = DB.reconciliations[account];
  return rec && Array.isArray(rec.history) ? rec.history : [];
}
function renderReconcile(c){
  const accounts = activeAccountNames();
  if(!accounts.length){
    c.innerHTML = `<div class="empty-state panel"><h4>Add an account first</h4><p>Accounts can be created from Settings, then checked here against a bank statement.</p></div>`;

  const accountRecord=accountRecordFor(account),liability=!!(accountRecord&&isLiabilityType(accountRecord.type));
  const statementDate = UI.reconcileDate || todayISO();
  const statementInput = UI.reconcileStatementBalance==='' ? null : Number(UI.reconcileStatementBalance);
  const statementValue = statementInput===null ? null : (liability?-Math.abs(statementInput):statementInput);
  const ledgerBalance = clearedAccountBalance(account, statementDate);
  const difference = statementValue===null || !Number.isFinite(statementValue) ? null : statementValue-ledgerBalance;
  const txs = accountTransactionsTo(account, statementDate);
  const history = reconciliationHistory(account);
  const last = history.length ? history[history.length-1] : null;
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Statement check<small>Tick cleared transactions until the difference reaches £0.00, then complete the reconciliation.</small></div>

          ${last ? `<button class="btn btn-sm btn-ghost" id="rec-reopen">Reopen last reconciliation</button>` : ''}
        </div>
      </div>
      <div class="filters-row">
        <div class="field"><label>Account</label><select id="rec-account">${accounts.map(a=>`<option value="${escAttr(a)}" ${a===account?'selected':''}>${escHTML(a)}</option>`).join('')}</select></div>
        <div class="field"><label>Statement date</label><input type="date" id="rec-date" value="${statementDate}"></div>
        <div class="field"><label>${liability?'Statement amount owed':'Statement balance'} (£)</label><input type="number" step="0.01" ${liability?'min="0"':''} id="rec-balance" value="${statementInput===null?'':statementInput}"></div>
      </div>
      <div class="reconcile-summary">
        <div class="reconcile-figure"><div class="lbl">Cleared ledger balance</div><div class="val num">${gbp(ledgerBalance)}</div></div>
        <div class="reconcile-figure"><div class="lbl">${liability?'Statement amount owed':'Statement balance'}</div><div class="val num">${statementValue===null?'—':(liability?gbp(Math.abs(statementValue)):gbp(statementValue))}</div></div>
        <div class="reconcile-figure"><div class="lbl">Difference</div><div class="val num" style="color:${difference===null?'var(--ink-faint)':(Math.abs(difference)<0.005?'var(--income)':'var(--expense)')}">${difference===null?'—':gbp(difference)}</div></div>
      </div>
      ${last ? `<p style="font-size:11.5px;color:var(--ink-faint);margin:0 0 14px;">Last completed: ${ukDate(last.statementDate)} at ${liability?`${gbp(Math.abs(last.statementBalance))} owed`:gbp(last.statementBalance)} · ${last.transactionCount} transaction${last.transactionCount===1?'':'s'} locked</p>` : ''}
      <div class="table-wrap"><table><thead><tr><th style="width:44px;">Cleared</th><th>Date</th><th>Description</th><th>Category</th><th>Status</th><th style="text-align:right;">Amount</th></tr></thead>
        <tbody>${txs.length ? txs.map(t=>{
          const status = transactionStatus(t), locked = status==='reconciled';

        }).join('') : `<tr class="empty-row"><td colspan="6">No transactions for this account by the statement date.</td></tr>`}</tbody>

    </div>
    ${history.length ? `<div class="panel"><div class="panel-head"><div class="panel-title">Reconciliation history</div></div>${history.slice().reverse().map(h=>`<div class="movers-row"><span class="movers-desc">${ukDate(h.statementDate)}<br><span style="font-size:10.5px;color:var(--ink-faint);">Completed ${new Date(h.completedAt).toLocaleString('en-GB')}</span></span><span class="movers-amt num">${gbp(h.statementBalance)}</span></div>`).join('')}</div>` : ''}
  `;
  document.getElementById('rec-account').onchange = e=>{ UI.reconcileAccount=e.target.value; UI.reconcileStatementBalance=''; renderReconcile(c); };

  c.querySelectorAll('[data-rec-id]').forEach(cb=>{
    cb.onchange = ()=>{
      const t = DB.transactions.find(x=>x.id===cb.dataset.recId);

function completeReconciliation(account, statementDate, statementBalance){
  const difference = statementBalance-clearedAccountBalance(account,statementDate);
  if(!Number.isFinite(statementBalance) || Math.abs(difference)>=0.005){ toast('The difference must be £0.00 before completing', 'error'); return; }
  const id = uid('rec');
  const affected = accountTransactionsTo(account,statementDate).filter(t=>transactionStatus(t)==='cleared');
  affected.forEach(t=>{ t.status='reconciled'; t.reconciliationId=id; });
  if(!DB.reconciliations[account]) DB.reconciliations[account]={history:[]};
  if(!Array.isArray(DB.reconciliations[account].history)) DB.reconciliations[account].history=[];
  DB.reconciliations[account].history.push({id,statementDate,statementBalance,completedAt:new Date().toISOString(),transactionCount:affected.length});
  const record=accountRecordFor(account),label=record&&isLiabilityType(record.type)?`${gbp(Math.abs(statementBalance))} owed`:gbp(statementBalance);
  scheduleSave(); renderContent(); toast(`Reconciled ${account} to ${label}`);
}
function reopenLastReconciliation(account){
  const history = reconciliationHistory(account);
  const last = history[history.length-1];
  if(!last) return;
  openModal(`<div class="modal-head"><h3>Reopen reconciliation?</h3></div><div class="modal-body"><p style="margin:0;color:var(--ink-soft);font-size:13px;">Transactions locked by the ${ukDate(last.statementDate)} reconciliation will return to Cleared so they can be corrected.</p></div><div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-confirm">Reopen</button></div>`);
  document.getElementById('m-cancel').onclick=closeModal;
  document.getElementById('m-confirm').onclick=()=>{
    DB.transactions.forEach(t=>{ if(t.reconciliationId===last.id){ t.status='cleared'; delete t.reconciliationId; } });
    history.pop(); scheduleSave(); closeModal(); renderContent(); toast('Last reconciliation reopened');
  };
}
function openBalanceAdjustmentModal(account, date){
  openModal(`<div class="modal-head"><h3>Add balance adjustment</h3></div><div class="modal-body"><p style="margin:0 0 14px;color:var(--ink-soft);font-size:12.5px;">Use this only when the opening balance or transaction history cannot otherwise be corrected. It changes the account balance but is excluded from income and spending reports.</p><div class="form-grid"><div class="field"><label>Date</label><input type="date" id="adj-date" value="${date}"></div><div class="field"><label>Adjustment (£)</label><input type="number" step="0.01" id="adj-amount"></div><div class="field span2"><label>Reason</label><input type="text" id="adj-notes" placeholder="e.g. Opening balance correction"></div></div></div><div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">Add adjustment</button></div>`);

function filteredSortedTx(){
  let list = DB.transactions.slice();
  const f = UI.txFilters;
  if(f.search){
    const q = f.search.toLowerCase();
    list = list.filter(t=> t.description.toLowerCase().includes(q) || (t.notes||'').toLowerCase().includes(q));
  }
  if(f.category!=='all'){
    list = list.filter(t=> f.category==='uncategorised'
      ? (!t.category && !t.transferId && !(t.splits&&t.splits.length))
      : (t.splits&&t.splits.length ? t.splits.some(s=>s.category===f.category) : t.category===f.category));
  }
  if(f.type!=='all'){
    if(f.type==='transfer') list = list.filter(t=> !!t.transferId);
    else if(f.type==='excluded') list = list.filter(t=> !!t.excluded && !t.transferId);
    else if(f.type==='income') list = list.filter(t=> t.amount>0 && !t.transferId);
    else list = list.filter(t=> t.amount<0 && !t.transferId);
  }
  if(f.status && f.status!=='all') list = list.filter(t=>transactionStatus(t)===f.status);
  if(f.from) list = list.filter(t=> t.date >= f.from);
  if(f.to) list = list.filter(t=> t.date <= f.to);
  const {col, dir} = UI.txSort;
  list.sort((a,b)=>{
    let av=a[col], bv=b[col];
    if(col==='amount'){ av=Math.abs(a.amount); bv=Math.abs(b.amount); }
    if(typeof av==='string') av=av.toLowerCase();
    if(typeof bv==='string') bv=bv.toLowerCase();
    if(av<bv) return dir==='asc'?-1:1;
    if(av>bv) return dir==='asc'?1:-1;
    return 0;
  });
  return list;
}

        <option value="all">All statuses</option>
        <option value="pending" ${f.status==='pending'?'selected':''}>Pending</option>
        <option value="cleared" ${f.status==='cleared'?'selected':''}>Cleared</option>
        <option value="reconciled" ${f.status==='reconciled'?'selected':''}>Reconciled</option>
      </select></div>
      <div class="field"><label>From</label><input type="date" id="f-from" value="${f.from}"></div>
      <div class="field"><label>To</label><input type="date" id="f-to" value="${f.to}"></div>
      <div class="field"><label>&nbsp;</label><button class="btn btn-ghost btn-sm" id="f-clear">Clear filters</button></div>
    </div>
    <div id="bulk-toolbar"></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:32px;"><input type="checkbox" id="tx-select-all"></th>
          <th data-col="date">Date</th>
          <th data-col="description">Description</th>
          <th data-col="category">Category</th>
          <th data-col="account">Account</th>
          <th data-col="status">Status</th>
          <th data-col="amount" style="text-align:right;">Amount</th>
          <th></th>
        </tr></thead>
        <tbody id="tx-body"></tbody>
      </table>
    </div>
  `;
  let txFilterDebounce = null;
  const debouncedFilterChange = ()=>{
    clearTimeout(txFilterDebounce);
    txFilterDebounce = setTimeout(onTxFilterChange, 180);
  };
  ['f-search','f-category','f-type','f-status','f-from','f-to'].forEach(id=>{
    document.getElementById(id).addEventListener('input', debouncedFilterChange);
    document.getElementById(id).addEventListener('change', onTxFilterChange);
  });
  document.getElementById('f-clear').onclick = ()=>{
    UI.txFilters = {search:'', category:'all', type:'all', status:'all', from:'', to:''};
    renderTransactions(c);
    updateRecheckButtonLabel();
  };
  document.querySelectorAll('th[data-col]').forEach(th=>{
    th.addEventListener('click', ()=>{
      if(UI.txSort.col===th.dataset.col) UI.txSort.dir = UI.txSort.dir==='asc'?'desc':'asc';
      else UI.txSort = {col:th.dataset.col, dir:'asc'};
      renderTxBody();
      document.querySelectorAll('th[data-col]').forEach(h=>h.classList.remove('sorted'));
      th.classList.add('sorted');
    });
  });
  document.getElementById('tx-select-all').addEventListener('change', (e)=>{
    const visible = filteredSortedTx();
    if(e.target.checked) visible.filter(t=>transactionStatus(t)!=='reconciled').forEach(t=> UI.txSelected.add(t.id));
    else visible.forEach(t=> UI.txSelected.delete(t.id));
    renderTxBody();
  });
  const txBody = document.getElementById('tx-body');
  txBody.addEventListener('click', handleTxBodyClick);
  txBody.addEventListener('change', handleTxBodyChange);
  renderTxBody();
}
function onTxFilterChange(){
  UI.txFilters.search = document.getElementById('f-search').value;
  UI.txFilters.category = document.getElementById('f-category').value;
  UI.txFilters.type = document.getElementById('f-type').value;
  UI.txFilters.status = document.getElementById('f-status').value;
  UI.txFilters.from = document.getElementById('f-from').value;
  UI.txFilters.to = document.getElementById('f-to').value;
  renderTxBody();
  updateRecheckButtonLabel();
}
function updateRecheckButtonLabel(){
  const btn = document.getElementById('btn-recheck');
  if(!btn) return;
  const f = UI.txFilters;
  const isFiltered = !!(f.search || f.category!=='all' || f.type!=='all' || (f.status&&f.status!=='all') || f.from || f.to);
  btn.innerHTML = isFiltered ? `${iconRefresh()} Re-check filtered` : `${iconRefresh()} Re-check all`;
}
function renderBulkToolbar(){
  const host = document.getElementById('bulk-toolbar');
  if(!host) return;
  const n = UI.txSelected.size;
  if(!n){ host.innerHTML = ''; return; }
  const accounts = activeAccountNames();
  host.innerHTML = `
    <div class="tag-toolbar">
      <span class="count"><strong>${n}</strong> selected</span>
      <button class="btn btn-sm btn-ghost" id="bulk-clear">Clear selection</button>
      <span style="flex:1"></span>
      <span>Set account:</span>
      <input type="text" id="bulk-account-input" list="bulk-account-list" placeholder="e.g. Current Account" style="width:150px;">
      <datalist id="bulk-account-list">${accounts.map(a=>`<option value="${escAttr(a)}">`).join('')}</datalist>
      <button class="btn btn-sm" id="bulk-account-apply">Apply</button>
      <span>Set category:</span>
      <select id="bulk-category-select" style="min-width:150px;">${categoryOptionsHTML('')}</select>
      <button class="btn btn-sm" id="bulk-category-apply">Apply</button>
      <span>Set status:</span>
      <select id="bulk-status-select"><option value="pending">Pending</option><option value="cleared">Cleared</option></select>
      <button class="btn btn-sm" id="bulk-status-apply">Apply</button>
      <label style="display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft);font-weight:500;white-space:nowrap;">
        <input type="checkbox" id="bulk-remember-rules"> Also create rules from these
      </label>
    </div>
  `;
  document.getElementById('bulk-clear').onclick = ()=>{ UI.txSelected.clear(); renderTxBody(); };
  document.getElementById('bulk-account-apply').onclick = ()=>{
    const val = document.getElementById('bulk-account-input').value.trim();
    if(!val){ toast('Enter an account name', 'error'); return; }
    ensureAccountRecord(val);
    let count = 0;
    const before = [];
    UI.txSelected.forEach(id=>{
      const t = DB.transactions.find(x=>x.id===id);
      if(t && !t.transferId){ before.push({id:t.id, account:t.account}); t.account = val; count++; }
    });
    pushUndo(`set account to "${val}" for ${count} transaction${count===1?'':'s'}`, ()=>{
      before.forEach(b=>{ const t = DB.transactions.find(x=>x.id===b.id); if(t) t.account = b.account; });
    });
    scheduleSave(); UI.txSelected.clear(); renderTxBody(); renderSidebarBits();
    offerUndo(`Set account to "${val}" for ${count} transaction${count===1?'':'s'}`);
  };
  document.getElementById('bulk-category-apply').onclick = ()=>{
    const val = document.getElementById('bulk-category-select').value;
    const alsoLearn = document.getElementById('bulk-remember-rules').checked;
    let count = 0;
    const learned = [];
    const before = [];
    UI.txSelected.forEach(id=>{
      const t = DB.transactions.find(x=>x.id===id);
      if(t && !t.transferId && !(t.splits&&t.splits.length)){
        before.push({id:t.id, category:t.category});
        t.category = val;
        count++;
        if(alsoLearn){
          const r = learnRuleFromTransaction(t);
          if(r) learned.push(r);
        }
      }
    });
    pushUndo(`set category to "${val}" for ${count} transaction${count===1?'':'s'}`, ()=>{
      before.forEach(b=>{ const t = DB.transactions.find(x=>x.id===b.id); if(t) t.category = b.category; });
      learned.forEach(r=>{ DB.rules = DB.rules.filter(x=> !(x.keyword===r.keyword && x.category===r.category)); });
    });
    scheduleSave(); UI.txSelected.clear(); renderTxBody(); renderSidebarBits();
    if(alsoLearn && learned.length){
      offerUndo(`Set category for ${count} transaction${count===1?'':'s'} — learned ${learned.length} new rule${learned.length===1?'':'s'} (e.g. "${learned[0].keyword}" → ${learned[0].category})`);
    } else {
      offerUndo(`Set category for ${count} transaction${count===1?'':'s'}`);
    }
  };
  document.getElementById('bulk-status-apply').onclick = ()=>{
    const status = document.getElementById('bulk-status-select').value;
    const before=[];
    UI.txSelected.forEach(id=>{
      const t=DB.transactions.find(x=>x.id===id);
      if(t && transactionStatus(t)!=='reconciled'){ before.push({id:t.id,status:t.status});t.status=status; }
    });
    pushUndo(`set ${before.length} transaction${before.length===1?'':'s'} to ${status}`,()=>before.forEach(b=>{const t=DB.transactions.find(x=>x.id===b.id);if(t)t.status=b.status;}));
    scheduleSave();UI.txSelected.clear();renderTxBody();offerUndo(`Marked ${before.length} transaction${before.length===1?'':'s'} as ${status}`);
  };
}
function renderTxBody(){
  const body = document.getElementById('tx-body');
  const list = filteredSortedTx();
  renderBulkToolbar();
  const selectAll = document.getElementById('tx-select-all');
  if(selectAll){
    const editable = list.filter(t=>transactionStatus(t)!=='reconciled');
    selectAll.checked = editable.length>0 && editable.every(t=> UI.txSelected.has(t.id));
  }
  if(!list.length){
    body.innerHTML = `<tr class="empty-row"><td colspan="8">No transactions match these filters.</td></tr>`;
    return;
  }
  body.innerHTML = list.map(rowHTML_tx).join('');
}
function handleTxBodyClick(e){
  const badge = e.target.closest('[data-action="open-cat-picker"]');
  if(badge){ openInlineCategoryPicker(badge); return; }
  const splitBtn = e.target.closest('[data-action="open-split"]');
  if(splitBtn){ openSplitModal(splitBtn.dataset.id); return; }
  const editBtn = e.target.closest('[data-action="edit-tx"]');
  if(editBtn){ openTxModal(editBtn.dataset.id); return; }
  const delBtn = e.target.closest('[data-action="delete-tx"]');
  if(delBtn){ deleteTx(delBtn.dataset.id); return; }
  const convBtn = e.target.closest('[data-action="convert-transfer"]');
  if(convBtn){ openConvertToTransferModal(convBtn.dataset.id); return; }
  const revBtn = e.target.closest('[data-action="revert-transfer"]');
  if(revBtn){ revertTransfer(revBtn.dataset.id); return; }
}
function handleTxBodyChange(e){
  if(!e.target.classList.contains('tx-row-check')) return;
  const id = e.target.dataset.id;
  if(e.target.checked) UI.txSelected.add(id);
  else UI.txSelected.delete(id);
  renderBulkToolbar();
  const selectAll = document.getElementById('tx-select-all');
  if(selectAll){
    const list = filteredSortedTx();
    const editable = list.filter(t=>transactionStatus(t)!=='reconciled');
    selectAll.checked = editable.length>0 && editable.every(t=> UI.txSelected.has(t.id));
  }
}
function openInlineCategoryPicker(badgeEl){
  const id = badgeEl.dataset.id;
  const t = DB.transactions.find(x=>x.id===id);
  if(!t) return;
  if(transactionStatus(t)==='reconciled'){ toast('Reconciled transactions are locked. Reopen the reconciliation first.', 'error'); return; }
  const td = badgeEl.closest('td');
  const sel = document.createElement('select');
  sel.className = 'cat-select-inline';
  sel.innerHTML = categoryOptionsHTML(t.category);
  sel.value = t.category || '';
  td.innerHTML = '';
  td.appendChild(sel);
  sel.focus();
  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    t.category = sel.value;
    scheduleSave();
    renderSidebarBits();
    const kind = categoryKind(t.category);
    const stampClass = !t.category ? 'c-none' : (kind==='income' ? 'c-income' : 'c-expense');
    const badge = document.createElement('span');
    badge.className = `stamp ${stampClass} cat-badge-clickable`;
    badge.dataset.action = 'open-cat-picker';
    badge.dataset.id = t.id;
    badge.title = 'Click to change category';
    badge.textContent = t.category || 'Uncategorised';
    td.innerHTML = '';
    td.appendChild(badge);
    toast('Category updated');
  }
  sel.addEventListener('change', commit);
  sel.addEventListener('blur', commit);
}

      <td class="desc" title="${escAttr(t.description)}">${escHTML(t.description)}</td>

  return `<tr>

    <td class="num">${ukDate(t.date)}</td>
    <td class="desc" title="${escAttr(t.description)}">${escHTML(t.description)}${t.excluded ? ' <span class="stamp-mini" title="Not counted in income/spending totals">excl.</span>' : ''}</td>
    <td class="cat-cell"><span class="stamp ${stampClass} cat-badge-clickable" data-action="${isSplit?'open-split':'open-cat-picker'}" data-id="${t.id}" title="${isSplit?'Click to edit split':'Click to change category'}">${escHTML(catLabel)}</span></td>
    <td>${escHTML(t.account||'—')}</td>
    <td>${statusPillHTML(status)}</td>
    <td class="amt ${t.amount>0?'income':''}">${gbp(t.amount,{signed:true})}</td>
    <td class="row-actions">

      <button class="row-icon-btn" data-action="delete-tx" data-id="${t.id}" title="Delete">${iconTrash()}</button>
    </td>
  </tr>`;

function iconSplit(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v7a4 4 0 0 0 4 4h4"/><path d="M6 21v-7"/><path d="m14 10 4 4-4 4"/></svg>`; }

function deleteTx(id){
  const t = DB.transactions.find(x=>x.id===id);
  if(!t) return;
  if(transactionStatus(t)==='reconciled'){ toast('Reconciled transactions are locked. Reopen the reconciliation first.', 'error'); return; }
  const pair = t.transferId ? DB.transactions.find(x=> x.transferId===t.transferId && x.id!==t.id) : null;
  if(pair && transactionStatus(pair)==='reconciled'){ toast('The matching side is reconciled and locked. Reopen that account reconciliation first.', 'error'); return; }
  openModal(`
    <div class="modal-head"><h3>${pair ? 'Delete this transfer?' : 'Delete transaction?'}</h3></div>
    <div class="modal-body">
      <p style="margin:0 0 4px;">${escHTML(t.description)}</p>
      <p style="color:var(--ink-soft); font-size:13px; margin:0;">${ukDate(t.date)} · ${gbp(t.amount,{signed:true})}</p>
      ${pair ? `<p style="color:var(--ink-soft); font-size:13px; margin:8px 0 0;">This will also remove the matching side: <strong>${escHTML(pair.account)}</strong> ${gbp(pair.amount,{signed:true})}.</p>` : ''}
    </div>
    <div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-danger" id="m-confirm">Delete</button></div>
  `);
  document.getElementById('m-cancel').onclick = closeModal;
  document.getElementById('m-confirm').onclick = ()=>{
    if(pair) DB.transactions = DB.transactions.filter(x=> x.transferId !== t.transferId);
    else DB.transactions = DB.transactions.filter(x=>x.id!==id);
    scheduleSave(); closeModal(); renderContent(); toast(pair ? 'Transfer deleted' : 'Transaction deleted');
  };
}
function openConvertToTransferModal(id){
  const t = DB.transactions.find(x=>x.id===id);
  if(!t || t.transferId) return;
  if(transactionStatus(t)==='reconciled'){ toast('Reconciled transactions are locked. Reopen the reconciliation first.', 'error'); return; }
  if(t.splits && t.splits.length){ toast('Remove the split before converting this to a transfer', 'error'); return; }
  const outgoing = t.amount<0;
  openModal(`
    <div class="modal-head"><h3>Convert to transfer</h3></div>
    <div class="modal-body">
      <p style="margin:0 0 4px;">${escHTML(t.description)}</p>
      <p style="color:var(--ink-soft); font-size:13px; margin:0 0 14px;">${ukDate(t.date)} · ${escHTML(t.account||'—')} · ${gbp(t.amount,{signed:true})}</p>
      <div class="field">
        <label>${outgoing ? 'Which account did this money go TO?' : 'Which account did this money come FROM?'}</label>
        <input type="text" id="cv-other-account" list="account-list-cv" placeholder="e.g. Savings">
        <datalist id="account-list-cv">${activeAccountNames().filter(a=>a!==t.account).map(a=>`<option value="${escAttr(a)}">`).join('')}</datalist>
      </div>
      <p style="color:var(--ink-faint); font-size:11.5px; margin:10px 0 0;">This will link it to a matching entry on the other account and remove its category, since transfers between your own accounts aren't counted as income or spending.</p>
    </div>
    <div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-confirm">Convert</button></div>
  `);
  document.getElementById('m-cancel').onclick = closeModal;
  document.getElementById('m-confirm').onclick = ()=>{
    const otherAccount = document.getElementById('cv-other-account').value.trim();
    if(!otherAccount){ toast('Enter the other account', 'error'); return; }
    if(otherAccount === t.account){ toast('That\u2019s the same account this transaction is already on', 'error'); return; }
    ensureAccountRecord(otherAccount);
    const tid = uid('xfer');
    t.transferId = tid;
    t.preTransferCategory = t.category;
    t.category = '';
    DB.transactions.push({
      id: uid('tx'), date: t.date, amount: -t.amount,
      description: outgoing ? `Transfer from ${t.account}` : `Transfer to ${t.account}`,
      category: '', account: otherAccount, notes: t.notes||'', source:'manual', transferId: tid, status:transactionStatus(t),
    });
    scheduleSave(); closeModal(); renderContent();
    toast('Converted to a transfer');
  };
}
function revertTransfer(id){
  const t = DB.transactions.find(x=>x.id===id);
  if(!t || !t.transferId) return;
  if(transactionStatus(t)==='reconciled'){ toast('Reconciled transactions are locked. Reopen the reconciliation first.', 'error'); return; }
  const pair = DB.transactions.find(x=> x.transferId===t.transferId && x.id!==t.id);
  if(pair && transactionStatus(pair)==='reconciled'){ toast('The matching side is reconciled and locked. Reopen that account reconciliation first.', 'error'); return; }
  const hadOriginalCategory = t.preTransferCategory !== undefined;
  openModal(`
    <div class="modal-head"><h3>Remove transfer tag?</h3></div>
    <div class="modal-body">
      <p style="margin:0 0 4px;">${escHTML(t.description)}</p>
      <p style="color:var(--ink-soft); font-size:13px; margin:0 0 12px;">${ukDate(t.date)} · ${escHTML(t.account||'—')} · ${gbp(t.amount,{signed:true})}</p>
      <p style="color:var(--ink-soft); font-size:13px; margin:0;">This one will go back to being a normal ${t.amount>0?'income':'expense'} transaction${hadOriginalCategory && t.preTransferCategory ? `, restored to its original category (<strong>${escHTML(t.preTransferCategory)}</strong>)` : ''}.</p>
      ${pair ? `<p style="color:var(--ink-soft); font-size:13px; margin:8px 0 0;">The matching entry on <strong>${escHTML(pair.account)}</strong> (${gbp(pair.amount,{signed:true})}) will be deleted, since it only existed to make the transfer balance.</p>` : ''}
    </div>
    <div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-confirm">Remove transfer tag</button></div>
  `);
  document.getElementById('m-cancel').onclick = closeModal;
  document.getElementById('m-confirm').onclick = ()=>{
    if(pair) DB.transactions = DB.transactions.filter(x=> x.id!==pair.id);
    delete t.transferId;
    if(hadOriginalCategory){ t.category = t.preTransferCategory; delete t.preTransferCategory; }
    scheduleSave(); closeModal(); renderContent();
    toast('Transfer tag removed');
  };
}

function openSplitModal(id){
  const t = DB.transactions.find(x=>x.id===id);
  if(!t) return;
  if(transactionStatus(t)==='reconciled'){ toast('Reconciled transactions are locked. Reopen the reconciliation first.', 'error'); return; }
  if(t.transferId){ toast('Transfers can\u2019t be split', 'error'); return; }
  const sign = t.amount<0 ? -1 : 1;
  const total = Math.abs(t.amount);
  const kind = t.amount>0 ? 'income' : 'expense';
  let rows;
  if(t.splits && t.splits.length){
    rows = t.splits.map(s=>({id:s.id||uid('sp'), category:s.category||'', amount:Math.abs(s.amount)}));
  } else {
    rows = [
      {id:uid('sp'), category:t.category||'', amount:total},
      {id:uid('sp'), category:'', amount:0},
    ];
  }
  const wasSplit = !!(t.splits && t.splits.length);

  function currentRemaining(){
    const allocated = rows.reduce((s,r)=> s+(parseFloat(r.amount)||0), 0);
    return Math.round((total-allocated)*100)/100;
  }
  function updateRemaining(){
    const remaining = currentRemaining();
    const el = document.getElementById('split-remaining');
    if(el){ el.textContent = gbp(remaining); el.style.color = Math.abs(remaining)<0.005 ? 'var(--income)' : 'var(--expense)'; }
    const saveBtn = document.getElementById('m-save');
    if(saveBtn) saveBtn.disabled = Math.abs(remaining) >= 0.005;
  }
  function render(){
    const catOpts = DB.categories.filter(c=>c.kind===kind);
    const remaining = currentRemaining();
    openModal(`
      <div class="modal-head"><h3>Split transaction</h3></div>
      <div class="modal-body">
        <p style="margin:0 0 4px;">${escHTML(t.description)}</p>
        <p style="color:var(--ink-soft);font-size:13px;margin:0 0 14px;">${ukDate(t.date)} · ${escHTML(t.account||'—')} · Total ${gbp(total)}</p>
        <div id="split-rows" style="display:flex;flex-direction:column;gap:8px;">
          ${rows.map((r,i)=>`
            <div style="display:flex;gap:8px;align-items:center;">
              <select class="split-cat" data-i="${i}" style="flex:1;min-width:0;">
                <option value="">Uncategorised</option>
                ${catOpts.map(c=>`<option value="${escAttr(c.name)}" ${r.category===c.name?'selected':''}>${escHTML(c.name)}</option>`).join('')}
              </select>
              <input type="number" class="split-amt" data-i="${i}" min="0" step="0.01" value="${r.amount.toFixed(2)}" style="width:100px;flex-shrink:0;">
              <button type="button" class="row-icon-btn" data-action="split-del" data-i="${i}" title="Remove this split" ${rows.length<=2?'disabled':''}>${iconTrash()}</button>
            </div>
          `).join('')}
        </div>
        <button type="button" class="btn btn-sm" id="split-add" style="margin-top:10px;">${iconPlus()} Add another split</button>
        <div class="qc-line qc-total" style="margin-top:14px;">
          <span>Remaining to allocate</span>
          <span class="num" id="split-remaining" style="color:${Math.abs(remaining)<0.005?'var(--income)':'var(--expense)'};">${gbp(remaining)}</span>
        </div>
      </div>
      <div class="modal-foot">
        ${wasSplit ? `<button class="btn" id="m-unsplit" style="margin-right:auto;">Remove split</button>` : ''}
        <button class="btn" id="m-cancel">Cancel</button>
        <button class="btn btn-primary" id="m-save" ${Math.abs(remaining)>=0.005?'disabled':''}>Save split</button>
      </div>
    `);
    wire();
  }
  function wire(){
    document.getElementById('m-cancel').onclick = closeModal;
    document.querySelectorAll('.split-cat').forEach(sel=> sel.onchange = e=>{ rows[+e.target.dataset.i].category = e.target.value; });
    document.querySelectorAll('.split-amt').forEach(inp=> inp.oninput = e=>{ rows[+e.target.dataset.i].amount = parseFloat(e.target.value)||0; updateRemaining(); });
    document.querySelectorAll('[data-action="split-del"]').forEach(b=> b.onclick = e=>{
      const i = +e.currentTarget.dataset.i;
      if(rows.length<=2) return;
      rows.splice(i,1);
      render();
    });
    document.getElementById('split-add').onclick = ()=>{ rows.push({id:uid('sp'), category:'', amount:0}); render(); };
    const unsplitBtn = document.getElementById('m-unsplit');
    if(unsplitBtn) unsplitBtn.onclick = ()=>{
      delete t.splits;
      t.category = '';
      scheduleSave(); closeModal(); renderContent(); renderSidebarBits();
      toast('Split removed — pick a category for this transaction');
    };
    document.getElementById('m-save').onclick = ()=>{
      if(Math.abs(currentRemaining()) >= 0.005){ toast('Amounts must add up to the total', 'error'); return; }
      const cleanRows = rows.filter(r=> r.amount>0.004);
      if(cleanRows.length < 2){
        delete t.splits;
        t.category = cleanRows[0] ? cleanRows[0].category : '';
      } else {
        t.splits = cleanRows.map(r=>({id:r.id, category:r.category, amount: sign*r.amount}));
        t.category = '';
      }
      scheduleSave(); closeModal(); renderContent(); renderSidebarBits();
      toast('Split saved');
    };
  }
  render();
}

function autoCategoriseAll(){
  let count = 0;
  const before = [];
  DB.transactions.forEach(t=>{
    if(!t.category && !t.transferId && !(t.splits&&t.splits.length)){
      const s = suggestCategory(t.description, t.amount);
      if(s){ before.push({id:t.id}); t.category = s; count++; }
    }
  });
  if(count){
    pushUndo(`auto-categorise ${count} transaction${count===1?'':'s'}`, ()=>{
      before.forEach(b=>{ const t = DB.transactions.find(x=>x.id===b.id); if(t) t.category=''; });
    });
    scheduleSave(); renderContent();
    offerUndo(`Auto-categorised ${count} transaction${count===1?'':'s'}`);
  }
  else toast('No matching rules for your uncategorised transactions');
}
function reapplyRulesToAll(){
  const f = UI.txFilters;
  const isFiltered = !!(f.search || f.category!=='all' || f.type!=='all' || f.from || f.to);
  const scope = filteredSortedTx();
  const changes = [];
  scope.forEach(t=>{
    if(t.transferId || (t.splits&&t.splits.length)) return;
    const suggested = suggestCategory(t.description, t.amount);
    if(suggested && suggested !== t.category){
      changes.push({id:t.id, description:t.description, prevCategory:t.category, from:t.category||'Uncategorised', to:suggested});
    }
  });
  const scopeLabel = isFiltered ? `within your current filters (${scope.length} transaction${scope.length===1?'':'s'} matched)` : `across all ${scope.length} transactions`;
  if(!changes.length){ toast(`Everything ${scopeLabel} already matches your current rules`); return; }
  openModal(`
    <div class="modal-head"><h3>Re-check ${isFiltered?'filtered':'all'} categories?</h3></div>
    <div class="modal-body">
      <p style="margin:0 0 10px;color:var(--ink-soft);font-size:13px;">${changes.length} transaction${changes.length===1?'':'s'} ${scopeLabel} will be updated to match your current rules — including ones that already have a different category assigned.</p>
      <div style="max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 10px;">
        ${changes.slice(0,10).map(c=>`<div style="font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);">${escHTML(c.description)}<br><span style="color:var(--ink-faint);">${escHTML(c.from)}</span> → <strong>${escHTML(c.to)}</strong></div>`).join('')}
        ${changes.length>10 ? `<div style="font-size:11.5px;color:var(--ink-faint);padding:6px 0 2px;">and ${changes.length-10} more…</div>` : ''}
      </div>
    </div>
    <div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-confirm">Update ${changes.length}</button></div>
  `);
  document.getElementById('m-cancel').onclick = closeModal;
  document.getElementById('m-confirm').onclick = ()=>{
    changes.forEach(c=>{
      const t = DB.transactions.find(x=>x.id===c.id);
      if(t) t.category = c.to;
    });
    pushUndo(`re-check ${changes.length} transaction${changes.length===1?'':'s'}`, ()=>{
      changes.forEach(c=>{ const t = DB.transactions.find(x=>x.id===c.id); if(t) t.category = c.prevCategory; });
    });
    scheduleSave(); closeModal(); renderContent();
    offerUndo(`Updated ${changes.length} transaction${changes.length===1?'':'s'}`);
  };
}

/* =========================================================
   DUPLICATE DETECTION
   ========================================================= */
function iconLayers(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>`; }
// Groups likely-duplicate transactions: an EXACT match (same date, amount,
// and description) is very high confidence — usually a statement imported
// twice. A LIKELY match (same amount, same cleaned merchant name, dates
// within 3 days) catches the same transaction entered once manually and
// once via a later import with a slightly different posted date. Transfers
// are excluded since a transfer pair is *supposed* to have a mirrored
// amount on a different account — that's not a duplicate, it's by design.
function findDuplicateGroups(){
  const list = DB.transactions.filter(t=>!t.transferId);
  const exactMap = new Map();
  list.forEach(t=>{
    const key = t.date+'|'+t.amount.toFixed(2)+'|'+t.description.trim().toUpperCase()+'|'+(t.account||'');
    if(!exactMap.has(key)) exactMap.set(key, []);
    exactMap.get(key).push(t);
  });
  const used = new Set();
  const groups = [];
  exactMap.forEach(group=>{
    if(group.length>1){
      groups.push({type:'exact', items:group});
      group.forEach(t=>used.add(t.id));
    }
  });
  const remaining = list.filter(t=>!used.has(t.id));
  const likelyMap = new Map();
  remaining.forEach(t=>{
    const key = t.amount.toFixed(2)+'|'+merchantKeyFor(t.description)+'|'+(t.account||'');
    if(!likelyMap.has(key)) likelyMap.set(key, []);
    likelyMap.get(key).push(t);
  });
  likelyMap.forEach(group=>{
    if(group.length<2) return;
    group.sort((a,b)=>a.date.localeCompare(b.date));
    // Cluster within the group by date proximity (<=3 days apart) rather than
    // treating the whole group as one cluster, in case the same merchant/amount
    // recurs months apart (e.g. a regular £30 top-up) — that's not a duplicate.
    let cluster = [group[0]];
    for(let i=1;i<group.length;i++){
      if(Math.abs(daysBetween(group[i-1].date, group[i].date)) <= 3){
        cluster.push(group[i]);
      } else {
        if(cluster.length>1) groups.push({type:'likely', items:cluster.slice()});
        cluster = [group[i]];
      }
    }
    if(cluster.length>1) groups.push({type:'likely', items:cluster.slice()});
  });
  return groups;
}
function openDuplicatesModal(){
  const groups = findDuplicateGroups();
  if(!groups.length){ toast('No likely duplicates found'); return; }
  const totalExtra = groups.reduce((s,g)=> s+(g.items.length-1), 0);
  openModal(`
    <div class="modal-head"><h3>Possible duplicate transactions</h3></div>
    <div class="modal-body">
      <p style="margin:0 0 10px;color:var(--ink-soft);font-size:13px;">Found ${groups.length} group${groups.length===1?'':'s'} — ${totalExtra} transaction${totalExtra===1?'':'s'} could be removed if these are true duplicates. Nothing is deleted until you tick a row and confirm below; the first entry in each group is kept by default.</p>
      <div id="dupe-groups" style="max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:12px;"></div>
    </div>
    <div class="modal-foot"><button class="btn" id="m-cancel">Close</button><button class="btn btn-primary" id="m-confirm">Delete selected</button></div>
  `, {wide:true});
  const host = document.getElementById('dupe-groups');
  host.innerHTML = groups.map((g,gi)=> `
    <div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;">
      <div style="font-size:11px;font-weight:600;color:${g.type==='exact'?'var(--expense)':'var(--gold)'};margin-bottom:6px;">${g.type==='exact' ? 'EXACT MATCH — same date, amount &amp; description' : 'LIKELY MATCH — same amount &amp; merchant, dates within a few days'}</div>
      ${g.items.map((t,ti)=> `
        <label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;cursor:pointer;">
          <input type="checkbox" class="dupe-check" data-gi="${gi}" data-id="${t.id}" ${ti>0?'checked':''}>
          <span style="flex:1;">${escHTML(t.description)} <span style="color:var(--ink-faint);">· ${escHTML(t.account||'—')}${(t.splits&&t.splits.length) ? ` · Split (${t.splits.length})` : (t.category?` · ${escHTML(t.category)}`:'')}</span></span>
          <span style="color:var(--ink-faint);">${ukDate(t.date)}</span>
          <span class="num" style="font-weight:600;min-width:70px;text-align:right;">${gbp(t.amount,{signed:true})}</span>
        </label>
      `).join('')}
    </div>
  `).join('');
  document.getElementById('m-cancel').onclick = closeModal;
  document.getElementById('m-confirm').onclick = ()=>{
    const ids = Array.from(host.querySelectorAll('.dupe-check:checked')).map(cb=>cb.dataset.id);
    if(!ids.length){ toast('Nothing selected', 'error'); return; }
    const deleted = DB.transactions.filter(t=>ids.includes(t.id)).map(t=> JSON.parse(JSON.stringify(t)));
    DB.transactions = DB.transactions.filter(t=>!ids.includes(t.id));
    pushUndo(`delete ${ids.length} duplicate transaction${ids.length===1?'':'s'}`, ()=>{
      DB.transactions.push(...deleted);
    });
    scheduleSave(); closeModal(); renderContent(); renderSidebarBits();
    offerUndo(`Deleted ${ids.length} duplicate transaction${ids.length===1?'':'s'}`);
  };
}

/* =========================================================
   SPENDING PLAN
   ========================================================= */
function computeManualRegular(){
  const now = new Date();
  const results = [];
  const expandedTx = expandSplits(DB.transactions);
  DB.regularCategories.forEach(catName=>{
    const cat = DB.categories.find(c=>c.name===catName);
    if(!cat) return;
    // Average over up to the last 3 *complete* months (excludes the current
    // partial month so it isn't skewed by however much has posted so far).
    const monthlyTotals = [];
    for(let i=1;i<=3;i++){
      const base = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const from = localISODate(base);
      const to = localISODate(new Date(base.getFullYear(), base.getMonth()+1, 0));
      const list = expandedTx.filter(t=> t.category===catName && t.date>=from && t.date<=to);
      if(list.length) monthlyTotals.push(list.reduce((s,t)=> s+Math.abs(t.amount), 0));
    }
    if(!monthlyTotals.length){
      results.push({ key:'manual:'+catName, description:catName, category:catName, amount:0, kind:cat.kind, manual:true, noHistory:true, stillDue:false });
      return;
    }
    const avg = monthlyTotals.reduce((s,v)=>s+v,0) / monthlyTotals.length;
    const thisMonthFrom = localISODate(new Date(now.getFullYear(), now.getMonth(), 1));
    const postedThisMonth = expandedTx.some(t=> t.category===catName && t.date>=thisMonthFrom);
    results.push({
      key: 'manual:'+catName,
      description: catName,
      category: catName,
      amount: cat.kind==='income' ? avg : -avg,
      kind: cat.kind,
      manual: true,
      monthsOfHistory: monthlyTotals.length,
      stillDue: !postedThisMonth,
    });
  });
  return results;
}

function recurringFrequencyLabel(item){
  return ({weekly:'Weekly',fortnightly:'Every 2 weeks',four_weekly:'Every 4 weeks',monthly:'Monthly',quarterly:'Quarterly',semiannual:'Every 6 months',annual:'Yearly',custom:`Every ${item.customDays||30} days`})[item.frequency] || 'Monthly';
}
function addAnchoredMonths(iso,months,anchorDay){
  const source=new Date(iso+'T00:00:00');
  const first=new Date(source.getFullYear(),source.getMonth()+months,1);
  const lastDay=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  first.setDate(Math.min(anchorDay||source.getDate(),lastDay));
  return localISODate(first);
}
function advanceRecurringDate(item,fromDate){
  const from=fromDate||item.nextDate;
  if(item.frequency==='weekly') return addDays(from,7);
  if(item.frequency==='fortnightly') return addDays(from,14);
  if(item.frequency==='four_weekly') return addDays(from,28);
  if(item.frequency==='quarterly') return addAnchoredMonths(from,3,item.anchorDay);
  if(item.frequency==='semiannual') return addAnchoredMonths(from,6,item.anchorDay);
  if(item.frequency==='annual') return addAnchoredMonths(from,12,item.anchorDay);
  if(item.frequency==='custom') return addDays(from,Math.max(1,item.customDays||30));
  return addAnchoredMonths(from,1,item.anchorDay);
}
function recurringMonthlyAmount(item){
  const factor=({weekly:52/12,fortnightly:26/12,four_weekly:13/12,monthly:1,quarterly:1/3,semiannual:1/6,annual:1/12})[item.frequency]
    || 365/(Math.max(1,item.customDays||30)*12);
  return item.amount*factor;
}
function recurringOccurrenceDates(item,horizon){
  if(item.status!=='active'||!validISODate(item.nextDate)) return [];
  const dates=[];let cursor=item.nextDate,guard=0;
  while(cursor<=horizon&&guard++<120){
    if(!item.endDate||cursor<=item.endDate) dates.push(cursor);
    if(item.endDate&&cursor>=item.endDate) break;
    const next=advanceRecurringDate(item,cursor);if(next<=cursor)break;cursor=next;
  }
  return dates;
}
function formalMatchesDetected(item,detected){
  const a=normalizeDescForRecurring(item.name),b=normalizeDescForRecurring(detected.description);
  return !!a&&a===b&&item.kind===(detected.amount>0?'income':'expense');
}
function formalRecurringRows(){
  return (DB.recurringItems||[]).filter(item=>item.status==='active').map(item=>({
    key:'formal:'+item.id,id:item.id,formal:true,manual:false,description:item.name,category:item.category,
    amount:item.kind==='income'?item.amount:-item.amount,monthlyAmount:item.kind==='income'?recurringMonthlyAmount(item):-recurringMonthlyAmount(item),
    kind:item.kind,nextExpected:item.nextDate,frequency:item.frequency,variable:item.variable,minAmount:item.minAmount,maxAmount:item.maxAmount,
    avgIntervalDays:null,status:item.status,item,
  }));
}
function savingsGoalBalance(goal){return Math.max(0,(goal.activity||[]).reduce((sum,entry)=>sum+Number(entry.amount||0),0));}
function savingsGoalMonthlyNeeded(goal){
  const remaining=Math.max(0,goal.targetAmount-savingsGoalBalance(goal));
  if(!remaining||goal.status==='paused')return 0;
  if(!goal.targetDate)return 0;
  const days=daysBetween(todayISO(),goal.targetDate);
  if(days<=0)return remaining;
  return remaining/Math.max(1,Math.ceil(days/30.4375));
}
function savingsGoalStats(){
  const goals=DB.savingsGoals||[];
  const allocated=goals.reduce((sum,g)=>sum+savingsGoalBalance(g),0);
  const target=goals.reduce((sum,g)=>sum+g.targetAmount,0);
  const monthlyNeeded=goals.reduce((sum,g)=>sum+savingsGoalMonthlyNeeded(g),0);
  const funded=goals.filter(g=>savingsGoalBalance(g)>=g.targetAmount).length;
  return {allocated,target,monthlyNeeded,funded};
}

function planNumbers(){
  const balance = currentBalance();
  const manualSet = new Set(DB.regularCategories);
  const formal = formalRecurringRows();
  // A category tracked manually supersedes any transaction-level auto-detection
  // within that same category, so nothing gets counted twice.
  const autoRaw = detectRecurring()
    .filter(r=> !DB.dismissedRecurring.includes(r.key))
    .filter(r=> !manualSet.has(r.category))
    .filter(r=> !formal.some(f=>formalMatchesDetected(f.item,r)));
  const manualRaw = computeManualRegular().filter(r=>!formal.some(f=>f.kind===r.kind&&f.category&&f.category===r.category));

  const nextIncomeDate = (()=>{
    const dates = formal.filter(r=>r.amount>0).map(r=> r.nextExpected).filter(d=>d>=todayISO()).sort();
    return dates.length ? dates[0] : null;
  })();
  const horizon = nextIncomeDate || addDays(todayISO(), 30);

  const auto = autoRaw.map(r=> ({...r, manual:false, stillDue: r.nextExpected <= horizon}));
  const confirmed=formal.map(r=>({...r,stillDue:r.nextExpected<=horizon}));
  const all = [...confirmed,...auto, ...manualRaw];

  const recurringIncome = all.filter(r=> r.manual ? r.kind==='income' : r.amount>0).sort((a,b)=> (a.nextExpected||'9999').localeCompare(b.nextExpected||'9999'));
  const recurringExpense = all.filter(r=> r.manual ? r.kind!=='income' : r.amount<=0).sort((a,b)=> (a.nextExpected||'9999').localeCompare(b.nextExpected||'9999'));

  const regularMonthlyOutgoings = recurringExpense.reduce((s,r)=> s+Math.abs(r.formal?r.monthlyAmount:r.amount), 0);
  const regularMonthlyIncome = recurringIncome.reduce((s,r)=> s+(r.formal?r.monthlyAmount:r.amount), 0);
  const scheduledMonthlyOutgoings=confirmed.filter(r=>r.amount<0).reduce((s,r)=>s+Math.abs(r.monthlyAmount),0);
  const scheduledMonthlyIncome=confirmed.filter(r=>r.amount>0).reduce((s,r)=>s+r.monthlyAmount,0);

  const stillDueItems = confirmed.filter(r=>r.amount<0&&r.stillDue);
  const stillDueTotal = stillDueItems.reduce((s,r)=> s+(r.formal?recurringOccurrenceDates(r.item,horizon).length*Math.abs(r.amount):Math.abs(r.amount)), 0);
  const goalStats=savingsGoalStats();
  const wishlistTotal = DB.wishlist.reduce((s,w)=> s+w.amount, 0);
  const availableBeforeWishlist=balance-stillDueTotal-goalStats.allocated;
  const availableToSpend = availableBeforeWishlist - wishlistTotal;
  return { balance, recurringIncome, recurringExpense, regularMonthlyOutgoings, regularMonthlyIncome,
    scheduledMonthlyOutgoings,scheduledMonthlyIncome,nextIncomeDate, horizon, stillDueItems, stillDueTotal,goalStats,wishlistTotal,availableBeforeWishlist,availableToSpend };
}

/* =========================================================
   INVESTMENTS
   ========================================================= */
function investExpenseList(list){
  return expandSplits(list).filter(t=> t.amount<0 && countsTowardTotals(t) && DB.investmentCategories.includes(t.category));
}
function investmentTransferContributionList(list){
  const investmentTypes=new Set(['investment','pension']);
  return list.filter(t=>{
    if(!t.transferId||t.amount<=0)return false;
    const destination=accountRecordFor(t.account);if(!destination||!investmentTypes.has(destination.type))return false;
    return DB.transactions.some(pair=>pair.transferId===t.transferId&&pair.id!==t.id&&pair.amount<0&&!investmentTypes.has((accountRecordFor(pair.account)||{}).type));
  }).map(t=>Object.assign({},t,{amount:-Math.abs(t.amount),category:'Investment transfer',contributionSource:'transfer'}));
}
function investmentContributionList(list){return [...investExpenseList(list),...investmentTransferContributionList(list)].sort((a,b)=>a.date.localeCompare(b.date));}
function sumInvest(list){ return investmentContributionList(list).reduce((s,t)=> s+Math.abs(t.amount), 0); }
function discretionaryExpenseList(list){
  return expandSplits(list).filter(t=> t.amount<0 && countsTowardTotals(t) && DB.discretionaryCategories.includes(t.category));
}
function sumDiscretionary(list){ return discretionaryExpenseList(list).reduce((s,t)=> s+Math.abs(t.amount), 0); }

// The headroom breakdown: income minus essentials minus what you already
// invest leaves your "uncommitted" money for the period. Some of that is
// already going to discretionary spending (dining out, etc); whatever's left
// beyond that is money that isn't allocated to anything in particular — the
// clearest candidate for a bigger contribution.
function investmentHeadroom(range){
  const list = txInRange(range.from, range.to);
  const income = sumIncome(list);
  const expense = sumExpense(list);
  const categorisedInvestAmt=investExpenseList(list).reduce((s,t)=>s+Math.abs(t.amount),0);
  const transferredInvestAmt=investmentTransferContributionList(list).reduce((s,t)=>s+Math.abs(t.amount),0);
  const investAmt = categorisedInvestAmt+transferredInvestAmt;
  const discAmt = sumDiscretionary(list);
  const essentialAmt = Math.max(0, expense - categorisedInvestAmt - discAmt);
  const headroom = income - essentialAmt - investAmt;
  const trueSurplus = headroom - discAmt;
  const rate = income > 0 ? (investAmt / income * 100) : 0;
  return { income, expense, investAmt,categorisedInvestAmt,transferredInvestAmt,discAmt,essentialAmt,headroom,trueSurplus,rate,count:investmentContributionList(list).length };
}
function investmentMonthlySeries(){
  return trendBuckets('month').map(b=>{
    const list = txInRange(b.from, b.to);
    const invest = sumInvest(list);
    const income = sumIncome(list);
    const rate = income > 0 ? (invest / income * 100) : 0;
    return { ...b, invest, income, rate };
  });
}
function investmentRecurring(){
  return detectRecurring()
    .filter(r=> DB.investmentCategories.includes(r.category))
    .map(r=>{
      const overdueDays = daysBetween(r.nextExpected, todayISO());
      return { ...r, overdueDays, missed: overdueDays > 5 };
    })
    .sort((a,b)=> b.overdueDays - a.overdueDays);
}
function lastInvestmentTx(){
  const all = investmentContributionList(DB.transactions).sort((a,b)=> b.date.localeCompare(a.date));
  return all.length ? all[0] : null;
}

// Generic single-source, multi-target Sankey ribbon path — a smooth curve
// connecting a vertical band on the left to a vertical band on the right.
// Shared by any Sankey diagram in the app; hand-rolled as inline SVG rather
// than pulling in a charting plugin, since a source-fans-out-to-targets shape
// is simple enough that this is less code and less risk than a new dependency.
function sankeyRibbonPath(x1,y1,h1,x2,y2,h2,curvature){
  curvature = curvature==null ? 0.6 : curvature;
  const pull = (x2-x1)*curvature;
  const cx1 = x1+pull, cx2 = x2-pull;
  return `M${x1},${y1} C${cx1},${y1} ${cx2},${y2} ${x2},${y2} L${x2},${y2+h2} C${cx2},${y2+h2} ${cx1},${y1+h1} ${x1},${y1+h1} Z`;
}

/* =========================================================

   ========================================================= */
const DOW_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function biggestTransactions(range, limit){
  return DB.transactions
    .filter(t=> countsTowardTotals(t) && t.date>=range.from && t.date<=range.to)
    .sort((a,b)=> Math.abs(b.amount)-Math.abs(a.amount))
    .slice(0, limit||10);
}
// A trailing N-day rolling sum, one point per day over the lookback window —
// different from spendByDayOfWeek (which buckets by weekday across a whole
// period) or the monthly trend charts (which reset at calendar boundaries).
// This tracks short-term trajectory: is spending over the last week/month
// accelerating or decelerating right now, regardless of where in the
// calendar month you happen to be.
function rollingSpendSeries(windowDays, lookbackDays){
  const series = [];
  for(let i=lookbackDays-1; i>=0; i--){
    const endDate = addDays(todayISO(), -i);
    const startDate = addDays(endDate, -(windowDays-1));
    const sum = sumExpense(txInRange(startDate, endDate));
    series.push({date: endDate, sum});
  }
  return series;
}
function spendMomentum(){
  const lookback = 90;
  const series7 = rollingSpendSeries(7, lookback);
  const series30 = rollingSpendSeries(30, lookback);
  function summarise(series, windowDays){
    const current = series[series.length-1].sum;
    // The non-overlapping window immediately before the current one.
    const prevIdx = series.length-1-windowDays;
    const previous = prevIdx>=0 ? series[prevIdx].sum : null;
    const pctChange = (previous!=null && previous>0.005) ? ((current-previous)/previous*100) : null;
    const maxInLookback = Math.max(...series.map(s=>s.sum));
    const isHighest = current>0.005 && Math.abs(current-maxInLookback)<0.005;
    return { current, previous, pctChange, isHighest };
  }
  return {
    series7, series30,
    win7: summarise(series7, 7),
    win30: summarise(series30, 30),
    lookback,
  };
}
function spendByDayOfWeek(range){
  const totals = [0,0,0,0,0,0,0], counts = [0,0,0,0,0,0,0];
  DB.transactions.forEach(t=>{
    if(!countsTowardTotals(t) || t.amount>=0) return;
    if(t.date<range.from || t.date>range.to) return;
    const dow = new Date(t.date+'T00:00:00').getDay();
    totals[dow] += Math.abs(t.amount);
    counts[dow]++;
  });
  return DOW_LABELS.map((label,i)=> ({label, total:totals[i], count:counts[i]}));
}
function savingsRateTrend(){
  const buckets = trendBuckets('month').map(b=>{
    const list = txInRange(b.from, b.to);
    const income = sumIncome(list);
    const expense = sumExpense(list);
    const net = income - expense;
    return Object.assign({}, b, {income, expense, net});
  });
  // A rate of (income − expense) ÷ income blows up whenever income is small
  // relative to a normal month — £20 income and £62 spend is a mundane
  // situation, but "−210% saved" reads as broken. Flag months where income
  // is well below this window's typical month (median of the months that
  // had any income at all) and clip what gets plotted, while keeping the
  // real number available for the tooltip.
  const incomes = buckets.map(b=>b.income).filter(v=>v>0).sort((a,b)=>a-b);
  const median = incomes.length ? incomes[Math.floor(incomes.length/2)] : 0;
  return buckets.map(b=>{
    const rawRate = b.income>0 ? (b.net/b.income*100) : 0;
    const lowIncome = median>0 && b.income>0 && b.income < median*0.25;
    const noIncome = b.income<=0;
    const displayRate = Math.max(-100, Math.min(150, rawRate));
    return Object.assign({}, b, {rawRate, displayRate, lowIncome, noIncome});
  });
}
function merchantSpendInRange(canonicalName, from, to){
  return txInRange(from,to).reduce((s,t)=>{
    if(t.amount>=0 || !countsTowardTotals(t)) return s;
    const rawKey = merchantKeyFor(t.description);
    const key = DB.merchantAliases[rawKey] || rawKey;
    return key===canonicalName ? s+Math.abs(t.amount) : s;
  }, 0);
}
function merchantSpendTrend(limit){
  limit = limit || 6;
  const now = todayISO();
  const curFrom = addMonths(now.slice(0,8)+'01', -2).slice(0,7)+'-01';
  const curTo = now;
  const prevFrom = addMonths(curFrom, -3);
  const prevTo = addDays(curFrom, -1);
  const top = topMerchants(txInRange(prevFrom, curTo), limit);
  return top.map(m=>{
    const cur = merchantSpendInRange(m.name, curFrom, curTo);
    const prev = merchantSpendInRange(m.name, prevFrom, prevTo);
    const delta = cur-prev;
    const pct = prev>0.005 ? (delta/prev*100) : (cur>0.005 ? 100 : 0);
    return {name:m.name, cur, prev, delta, pct};
  });
}
function yearOverYearSeries(){
  const now = new Date();
  const thisYearNum = now.getFullYear();
  const lastYearNum = thisYearNum-1;
  const months = [];
  for(let m=0;m<12;m++){
    const from1 = localISODate(new Date(thisYearNum,m,1));
    const to1 = localISODate(new Date(thisYearNum,m+1,0));
    const from0 = localISODate(new Date(lastYearNum,m,1));
    const to0 = localISODate(new Date(lastYearNum,m+1,0));
    months.push({
      label: new Date(thisYearNum,m,1).toLocaleDateString('en-GB',{month:'short'}),
      thisYear: sumExpense(txInRange(from1,to1)),
      lastYear: sumExpense(txInRange(from0,to0)),
    });
  }
  return {months, thisYearNum, lastYearNum};
}

function upcomingBillsFor(n, days){
  const horizon = addDays(todayISO(), days);
  const combined = [...n.recurringIncome, ...n.recurringExpense].filter(r=>r.formal);
  const dated = combined.flatMap(r=>r.formal
      ? recurringOccurrenceDates(r.item,horizon).map(date=>({...r,nextExpected:date,occurrence:true}))
      : [r])
    .filter(r=> !r.manual && r.nextExpected <= horizon)
    .sort((a,b)=> a.nextExpected.localeCompare(b.nextExpected));
  const undated = [];
  return { dated, undated };
}
function daysUntilLabel(dateStr){
  const d = daysBetween(todayISO(), dateStr);
  if(d<0) return `${Math.abs(d)}d overdue`;
  if(d===0) return 'today';
  if(d===1) return 'tomorrow';
  return `in ${d} days`;
}
function renderUpcoming(n){
  const host = document.getElementById('upcoming-list');
  if(!host) return;
  const { dated, undated } = upcomingBillsFor(n, UI.upcomingDays);
  if(!dated.length && !undated.length){
    host.innerHTML = `<div class="empty-state" style="padding:24px 10px;"><h4>Nothing scheduled soon</h4><p style="font-size:12.5px;">Add a recurring item or confirm a suggestion to place it on your upcoming schedule.</p></div>`;
    return;
  }
  let html = '';
  if(dated.length){
    html += dated.map(r=> `<div class="upcoming-row">
      <div class="upcoming-date">
        <div class="upcoming-day">${ukDateShort(r.nextExpected)}</div>
        <div class="upcoming-rel">${daysUntilLabel(r.nextExpected)}</div>
      </div>
      <div class="upcoming-desc">${escHTML(r.description)}${r.formal?` <span class="stamp-mini">scheduled</span>`:''}</div>
      <div class="upcoming-amt num" style="color:${r.amount>0?'var(--income)':'var(--ink)'}">${gbp(r.amount,{signed:true})}</div>
    </div>`).join('');
  }
  if(undated.length){
    html += `<div class="upcoming-subhead">Expected this month · no fixed date</div>`;
    html += undated.map(r=> `<div class="upcoming-row">
      <div class="upcoming-date"><div class="upcoming-day">—</div></div>
      <div class="upcoming-desc">${escHTML(r.description)} <span class="stamp-mini">est.</span></div>
      <div class="upcoming-amt num" style="color:${r.amount>0?'var(--income)':'var(--ink)'}">${gbp(r.amount,{signed:true})}</div>
    </div>`).join('');
  }
  host.innerHTML = html;
}

function renderManagedRecurring(){
  const host=document.getElementById('managed-recurring');if(!host)return;
  const items=[...(DB.recurringItems||[])].sort((a,b)=>{
    const rank={active:0,paused:1,ended:2};return (rank[a.status]-rank[b.status])||a.nextDate.localeCompare(b.nextDate);
  });
  if(!items.length){
    host.innerHTML=`<div class="empty-state" style="padding:28px 10px;"><h4>No confirmed schedules yet</h4><p style="font-size:12.5px;">Add one manually, or confirm a suggestion below. Confirmed dates are used for upcoming bills and available-to-spend.</p></div>`;return;

      <td class="desc"><strong>${escHTML(item.name)}</strong><div style="font-size:10.5px;color:var(--ink-faint);">${escHTML(item.category||'Uncategorised')}${item.account?` · ${escHTML(item.account)}`:''}${item.variable?' · variable':''}</div></td>

      <td><span class="status-pill ${statusClass}">${statusLabel}</span></td>
      <td class="amt num" style="color:${item.kind==='income'?'var(--income)':'var(--ink)'}">${item.kind==='income'?'+':'−'}${gbp(item.amount)}${range}</td>

        ${item.status!=='ended'?`<button class="row-icon-btn" data-action="rec-pause" data-id="${item.id}" title="${item.status==='paused'?'Resume':'Pause'}">${item.status==='paused'?iconPlay():iconPause()}</button>`:''}

  host.querySelectorAll('[data-action="rec-edit"]').forEach(b=>b.onclick=()=>openRecurringModal(b.dataset.id));
  host.querySelectorAll('[data-action="rec-occurred"]').forEach(b=>b.onclick=()=>openRecurringOccurrenceModal(b.dataset.id));
  host.querySelectorAll('[data-action="rec-skip"]').forEach(b=>b.onclick=()=>confirmSkipRecurring(b.dataset.id));
  host.querySelectorAll('[data-action="rec-pause"]').forEach(b=>b.onclick=()=>toggleRecurringPause(b.dataset.id));
  host.querySelectorAll('[data-action="rec-end"]').forEach(b=>b.onclick=()=>confirmEndRecurring(b.dataset.id));
}
function iconPause(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="9" y1="5" x2="9" y2="19"/><line x1="15" y1="5" x2="15" y2="19"/></svg>`;}

function advanceRecurringItem(item,throughDate){
  let next=advanceRecurringDate(item,item.nextDate),guard=0;

  item.nextDate=next;if(item.endDate&&item.nextDate>item.endDate)item.status='ended';
}

function savingsGoalState(goal){
  const saved=savingsGoalBalance(goal),remaining=Math.max(0,goal.targetAmount-saved),pct=goal.targetAmount?clamp(saved/goal.targetAmount*100,0,100):0;
  if(saved>=goal.targetAmount)return {label:'Funded',className:'status-cleared',saved,remaining,pct,onTrack:true};
  if(goal.status==='paused')return {label:'Paused',className:'status-reconciled',saved,remaining,pct,onTrack:false};
  if(goal.targetDate&&goal.targetDate<todayISO())return {label:'Overdue',className:'status-pending',saved,remaining,pct,onTrack:false};
  let onTrack=true;
  if(goal.targetDate&&validISODate(String(goal.createdAt||'').slice(0,10))){
    const start=String(goal.createdAt).slice(0,10),total=Math.max(1,daysBetween(start,goal.targetDate)),elapsed=clamp(daysBetween(start,todayISO()),0,total);
    onTrack=saved+0.01>=goal.targetAmount*(elapsed/total);
  }
  return {label:onTrack?'On track':'Behind',className:onTrack?'status-cleared':'status-pending',saved,remaining,pct,onTrack};
}
