// Words that turn up constantly as bank-statement transaction-type noise
// rather than merchant names. A rule keyed on one of these (or anything very
// short) is much more likely to misfire across unrelated transactions than
// to correctly identify one merchant — usually a sign it was learned from a
// description before enough of the noise prefix had been stripped away.
const RULE_NOISE_WORDS = new Set([
  'CARD','PAYMENT','PAYMENTS','DIRECT','DEBIT','CREDIT','TRANSFER','TFR',
  'FASTER','STANDING','ORDER','THIRD','PARTY','BILL','CONTACTLESS','ONLINE',
  'RECEIPT','WITHDRAWAL','CASH','ATM','REF','REFERENCE','MANDATE','GBP',
  'MADE','FROM','TO','AT','VIA','NO','RATE','POS','MOBILE','APP','GIRO','BANK','SO','DD',
]);
// Learns a new auto-tagging rule from an already-categorised transaction,
// reusing the same noise-stripped merchant-name extraction used for merchant
// grouping and recurring detection. Returns the {keyword, category} that was
// learned, or null if nothing was added (no category, an existing rule
// already covers this description, or the merchant name is too short/vague
// to be a safe keyword) — callers use this to skip silently rather than
// create redundant or low-quality rules.
function learnRuleFromTransaction(t){
  if(!t || !t.category) return null;
  if(suggestCategory(t.description, t.amount)) return null;
  const word = merchantKeyFor(t.description).toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim();
  if(word.length < 3) return null;
  if(DB.rules.some(r=> r.keyword.toUpperCase()===word)) return null;
  DB.rules.unshift({keyword:word, category:t.category});
  return {keyword:word, category:t.category};
}
function riskyRuleReason(keyword){
  const kw = (keyword||'').trim().toUpperCase();
  if(!kw) return '';
  if(RULE_NOISE_WORDS.has(kw)) return `"${kw}" is a common bank-statement word, not a merchant name — this rule may match far more transactions than intended.`;
  if(kw.length < 4) return `"${kw}" is quite short — it may match inside unrelated words or descriptions.`;
  return '';
}
function iconWarnTriangle(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`; }
function renderRuleList(){
  const host = document.getElementById('rule-list');
  if(!DB.rules.length){ host.innerHTML = `<div class="empty-state" style="padding:20px;"><p style="font-size:12.5px;">No rules yet. Add one to auto-suggest categories during import.</p></div>`; return; }
  const riskyCount = DB.rules.filter(r=> riskyRuleReason(r.keyword)).length;
  const audit=PocketLedgerRules.auditRules(DB.rules,DB.categories);
  const integrityProblems=audit.invalid.length+audit.missingCategories.length+audit.conflicts.length;
  const summary = `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:11.5px;margin-bottom:8px;">
    <span style="font-weight:700;color:${integrityProblems?'var(--expense)':'var(--income)'};">${integrityProblems?iconWarnTriangle():iconCheck()} ${audit.count} rules checked · ${audit.directional.length} direction-specific${integrityProblems?` · ${integrityProblems} integrity issue${integrityProblems===1?'':'s'}`:' · categories valid'}</span>
    ${audit.duplicates.length?`<span style="color:var(--ink-faint);">${audit.duplicates.length} exact duplicate${audit.duplicates.length===1?'':'s'} preserved</span>`:''}
    ${riskyCount?`<span style="color:var(--gold);font-weight:600;">${iconWarnTriangle()} ${riskyCount} generic-looking rule${riskyCount===1?'':'s'} to review</span>`:''}
  </div>`;
  host.innerHTML = summary + DB.rules.map((r,i)=>{
    const reason = riskyRuleReason(r.keyword);
    const dirBadge = r.direction==='out' ? `<span class="stamp-mini" style="color:var(--expense);background:var(--expense-wash);">money out only</span>`
      : r.direction==='in' ? `<span class="stamp-mini" style="color:var(--income);background:var(--income-wash);">money in only</span>` : '';
    return `
    <div class="rule-row">
      <span>if description contains</span>
      <span class="kw">${escHTML(r.keyword)}</span>
      ${dirBadge}
      ${reason ? `<span class="rule-risk-flag" style="color:var(--gold);cursor:help;" title="${escAttr(reason)}">${iconWarnTriangle()}</span>` : ''}
      <span class="arrow">→</span>
      <span class="rc"><strong>${escHTML(r.category)}</strong></span>
      <button class="row-icon-btn" data-action="edit-rule" data-i="${i}" title="Edit">${iconEdit()}</button>
      <button class="row-icon-btn" data-action="del-rule" data-i="${i}" title="Delete">${iconTrash()}</button>
    </div>
  `;
  }).join('');
  host.querySelectorAll('[data-action="edit-rule"]').forEach(b=> b.onclick = ()=> openRuleModal(parseInt(b.dataset.i)));
  host.querySelectorAll('[data-action="del-rule"]').forEach(b=> b.onclick = ()=>{
    DB.rules.splice(parseInt(b.dataset.i),1); scheduleSave(); renderRuleList(); toast('Rule deleted');
  });
}
function deleteCategory(name){
  const used = DB.transactions.filter(t=>t.category===name || (t.splits&&t.splits.some(s=>s.category===name))).length;
  openModal(`
    <div class="modal-head"><h3>Delete “${escHTML(name)}”?</h3></div>
    <div class="modal-body"><p style="margin:0;color:var(--ink-soft);font-size:13px;">${used ? `${used} transaction${used===1?'':'s'} using this category will become Uncategorised.` : 'This category is not currently used.'}</p></div>
    <div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-danger" id="m-confirm">Delete</button></div>
  `);
  document.getElementById('m-cancel').onclick = closeModal;
  document.getElementById('m-confirm').onclick = ()=>{
    DB.categories = DB.categories.filter(c=>c.name!==name);
    DB.transactions.forEach(t=>{
      if(t.category===name) t.category='';
      if(t.splits) t.splits.forEach(s=>{ if(s.category===name) s.category=''; });
    });
    DB.rules = DB.rules.filter(r=>r.category!==name);
    DB.regularCategories = DB.regularCategories.filter(n=>n!==name);
    DB.discretionaryCategories = DB.discretionaryCategories.filter(n=>n!==name);
    DB.investmentCategories = DB.investmentCategories.filter(n=>n!==name);
    DB.pendingCards = DB.pendingCards.filter(c=>c.category!==name);
    delete DB.budgets[name];
    scheduleSave(); closeModal(); renderContent(); toast('Category deleted');
  };
}

function ruleMatchPreview(keyword, direction){
  const matches=PocketLedgerRules.matchingTransactions(DB.transactions,keyword,direction);
  const uncategorised = matches.filter(t=> !t.category && !(t.splits&&t.splits.length)).length;
  const examples = matches.slice(0,3).map(t=>t.description);
  return {total:matches.length, uncategorised, examples};
}

  const rule = isEdit ? DB.rules[index] : null;

async function handleFile(file){
  const st = UI.importState;
  st.fileName = file.name;
  try{
    const buf = await file.arrayBuffer();
    const text = decodeSmart(buf);
    const result = Papa.parse(text.trim(), {skipEmptyLines:true});
    let rows = result.data;
    if(!rows.length){ toast('Could not read any rows from that file', 'error'); return; }
    if(st.hasHeader){
      st.headers = rows[0].map(h=>String(h||'').trim());
      st.rows = rows.slice(1);
    } else {
      st.headers = rows[0].map((_,i)=>'Column '+(i+1));
      st.rows = rows;
    }
    // Drop fully-blank trailing rows some banks add at the end of the export.
    st.rows = st.rows.filter(r=> r.some(cell=> String(cell||'').trim() !== ''));
    st.mapping = guessMapping(st.headers);
    st.step = 2;
    renderImport(document.getElementById('content'));
    toast(`Loaded ${st.rows.length} rows from ${file.name}`);
  }catch(err){
    console.error(err);
    toast('Could not read that file', 'error');
  }
}
function decodeSmart(buf){
  // Most exports are UTF-8, but some UK banks (e.g. Santander) export in
  // Windows-1252, where £ is a single byte that UTF-8 mangles into "�".
  // Try UTF-8 first; if it looks corrupted, fall back to Windows-1252.
  const utf8 = new TextDecoder('utf-8').decode(buf);
  if(utf8.indexOf('\ufffd') === -1) return utf8;
  try{ return new TextDecoder('windows-1252').decode(buf); }
  catch(e){ return utf8; }
}
function guessMapping(headers){
  const find = (names)=>{
    for(const n of names){
      const idx = headers.findIndex(h=> h.toLowerCase().replace(/[^a-z]/g,'').includes(n));
      if(idx>-1) return headers[idx];
    }
    return '';
  };
  const date = find(['date']);
  const description = find(['description','details','narrative','memo','reference']);
  const moneyIn = find(['moneyin','creditamount','paidin','credit']);
  const moneyOut = find(['moneyout','debitamount','paidout','debit']);
  const amount = find(['amount','value','transactionamount']);
  const mode = (moneyIn||moneyOut) && !amount ? 'split' : 'single';
  return {date, description, mode, amount: amount||'', moneyIn: moneyIn||'', moneyOut: moneyOut||''};
}

function parseImportRow(r, st){
  const hIdx = (name)=> st.headers.indexOf(name);
  const dIdx = hIdx(st.mapping.date), descIdx = hIdx(st.mapping.description);
  if(dIdx<0 || descIdx<0) return null;
  const date = parseAnyDate(r[dIdx], st.dateFormat);
  const description = String(r[descIdx]||'').trim();
  let amount = 0;
  if(st.mapping.mode==='single'){
    const aIdx = hIdx(st.mapping.amount);
    let v = parseMoney(r[aIdx]);
    if(!st.negativeIsOutgoing) v = -v;
    amount = v;
  } else {
    const inIdx = hIdx(st.mapping.moneyIn), outIdx = hIdx(st.mapping.moneyOut);
    const inV = inIdx>-1 ? parseMoney(r[inIdx]) : 0;
    const outV = outIdx>-1 ? parseMoney(r[outIdx]) : 0;
    amount = inV - Math.abs(outV);
  }
  return {date, description, amount};
}
function parseMoney(v){
  if(v===undefined||v===null||v==='') return 0;
  let s = String(v).trim();
  if(s==='') return 0;
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }
  // Strip everything except digits, minus and decimal point — covers £, $,
  // "GBP", stray "�" from encoding issues, thousands separators, etc.
  s = s.replace(/[^0-9.\-]/g, '');
  if(s.indexOf('-') > -1){ neg = true; s = s.replace(/-/g,''); }
  if(s==='') return 0;
  const n = parseFloat(s);
  return isNaN(n) ? 0 : (neg ? -n : n);
}
function parseAnyDate(v, fmt){
  if(!v) return '';
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){
    let a=parseInt(m[1]), b=parseInt(m[2]), y=m[3];
    if(y.length===2) y = (parseInt(y)>50?'19':'20')+y;
    let day,month;
    if(fmt==='MDY'){ month=a; day=b; } else { day=a; month=b; }
    if(month>12){ const t=month; month=day; day=t; }
    return `${y}-${pad(month)}-${pad(day)}`;
  }
  const d = new Date(s);
  if(!isNaN(d)) return localISODate(d);
  return '';
}
function pad(n){ return String(n).padStart(2,'0'); }

function buildParsedRows(){
  const st = UI.importState;
  const existingKeys = new Set(DB.transactions.map(t=> t.date+'|'+t.description.trim().toUpperCase()+'|'+t.amount.toFixed(2)));
  st.parsed = st.rows.map((r,i)=>{
    const p = parseImportRow(r, st);
    if(!p) return null;
    const key = p.date+'|'+p.description.trim().toUpperCase()+'|'+p.amount.toFixed(2);
    return {
      rowId: 'imp_'+i,
      date: p.date, description: p.description, amount: p.amount,
      category: suggestCategory(p.description, p.amount),
      duplicate: existingKeys.has(key),
      include: !existingKeys.has(key),
    };
  }).filter(Boolean);
}

function openInlineImportCategoryPicker(badgeEl){
  const st = UI.importState;
  const rowId = badgeEl.dataset.id;
  const p = st.parsed.find(x=>x.rowId===rowId);
  if(!p) return;
  const td = badgeEl.closest('td');
  const sel = document.createElement('select');
  sel.className = 'cat-select-inline';
  sel.innerHTML = categoryOptionsHTML(p.category);
  sel.value = p.category || '';
  td.innerHTML = '';
  td.appendChild(sel);
  sel.focus();
  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    p.category = sel.value;
    const kind = categoryKind(p.category);
    const stampClass = !p.category ? 'c-none' : (kind==='income' ? 'c-income' : 'c-expense');
    const badge = document.createElement('span');
    badge.className = `stamp ${stampClass} cat-badge-clickable`;
    badge.dataset.action = 'open-import-cat-picker';
    badge.dataset.id = p.rowId;
    badge.title = 'Click to change category';
    badge.textContent = p.category || 'Uncategorised';
    badge.addEventListener('click', ()=> openInlineImportCategoryPicker(badge));
    td.innerHTML = '';
    td.appendChild(badge);
  }
  sel.addEventListener('change', commit);
  sel.addEventListener('blur', commit);
}

function confirmImport(){
  const st = UI.importState;
  const destinationAccount = String(st.destinationAccount||'').trim();
  if(!destinationAccount){ toast('Choose an account for this import', 'error'); return; }
  const destinationRecord=accountRecordFor(destinationAccount);
  if(!destinationRecord||destinationRecord.archived||isLegacyImportedAccount(destinationAccount)){toast('Choose an active account from Settings before importing','error');return;}
  const toImport = st.parsed.filter(p=>p.include && p.date);
  if(!toImport.length){ toast('No rows selected to import', 'error'); return; }
  const learnedRules = [];
  toImport.forEach(p=>{
    const t = {
      id: uid('tx'), date:p.date, description:p.description, amount:p.amount,
      category:p.category||'', account:destinationAccount, notes:'', source:'import', status:'cleared'
    };
    DB.transactions.push(t);
    if(st.rememberRules){
      const learned = learnRuleFromTransaction(t);
      if(learned) learnedRules.push(learned);
    }
  });
  DB.transactions.sort((a,b)=> a.date.localeCompare(b.date));
  const mostRecent = toImport.reduce((best,p)=> (!best || p.date > best.date) ? p : best, null);
  DB.lastImport = {
    timestamp: new Date().toISOString(),
    fileName: st.fileName,
    count: toImport.length,
    account: destinationAccount,
    lastTx: mostRecent ? {date: mostRecent.date, description: mostRecent.description, amount: mostRecent.amount} : null,
  };
  scheduleSave();
  st.step = 4;
  st.importedCount = toImport.length;
  st.learnedRules = learnedRules;
  renderImport(document.getElementById('content'));
  renderSidebarBits();
}

        </span>
      </div>`;
    }).join('')}
  </div>`;
  host.querySelectorAll('[data-action="edit-account"]').forEach(b=>{b.onclick=()=>openAccountModal(b.dataset.id);});

}
function accountTypeOptions(selected){
  const assets=ACCOUNT_TYPES.filter(t=>t.group==='asset'),liabilities=ACCOUNT_TYPES.filter(t=>t.group==='liability');
  const opts=arr=>arr.map(t=>`<option value="${t.value}" ${t.value===selected?'selected':''}>${t.label}</option>`).join('');
  return `<optgroup label="Assets">${opts(assets)}</optgroup><optgroup label="Liabilities">${opts(liabilities)}</optgroup>`;
}
function syncLegacyAccounts(){
  DB.accounts=(DB.accountRecords||[]).map(r=>r.name);
  DB.accountStartingBalances={};
  DB.accountRecords.forEach(r=>{DB.accountStartingBalances[r.name]=Number(r.openingBalance)||0;});
  DB.transactions.forEach(t=>{const r=accountRecordFor(t.account);if(r)t.accountId=r.id;});
  DB.startingBalance=DB.accountRecords.length?(Number(DB.accountRecords[0].openingBalance)||0):0;
}
function legacyMovementCounts(){
  const rows=expandSplits(DB.transactions||[]);
  return {
    savingsOut:rows.filter(t=>t.amount<0&&t.category==='Savings'&&!t.transferId).length,
    savingsIn:rows.filter(t=>t.amount>0&&t.category==='Savings Withdrawal'&&!t.transferId).length,
    investmentOut:rows.filter(t=>t.amount<0&&t.category==='Investment Out'&&!t.transferId).length,
    investmentIn:rows.filter(t=>t.amount>0&&t.category==='Investment In'&&!t.transferId).length
  };
}

  const typeEl=document.getElementById('acct-type');
  function updateTypeFields(){
    const liability=isLiabilityType(typeEl.value);
    document.getElementById('acct-opening-label').textContent=liability?'Opening amount owed (£)':'Opening balance (£)';
    document.getElementById('acct-opening-help').textContent=liability?'Enter the positive amount owed; Pocket Ledger stores it as a liability.':['investment','pension'].includes(typeEl.value)?'For a clean cutover, enter the total value shown by your provider today. Later valuations supersede it.':'Enter the account value at the start of your transaction history.';

    const rawOpening=Number(document.getElementById('acct-opening').value||0),openingBalance=isLiabilityType(type)?-Math.abs(rawOpening):rawOpening;
    const openingBalanceDate=document.getElementById('acct-opening-date').value,limitRaw=Number(document.getElementById('acct-limit').value),creditLimit=type==='credit_card'&&Number.isFinite(limitRaw)&&limitRaw>0?limitRaw:null;

    if((DB.accountRecords||[]).some(r=>r.id!==(record&&record.id)&&r.name.toLowerCase()===name.toLowerCase())){toast('That account name already exists','error');return;}
    if(!Number.isFinite(rawOpening)||rawOpening<0){toast('Enter a valid opening amount','error');return;}
    if(record&&['investment','pension'].includes(record.type)&&!['investment','pension'].includes(type)&&(DB.investmentValuations||[]).some(v=>v.accountId===record.id)){toast('Delete this account’s valuations before changing it to a non-investment type','error');return;}

function storageStatusInfo(){
  if(IN_CLAUDE)return {label:'Claude storage',detail:'Data is stored by the Claude app. JSON export remains available for transfer.',canRecoverLegacy:false};
  const state=BROWSER_STORAGE?BROWSER_STORAGE.status():{mode:'starting'};
  if(state.mode==='indexeddb')return {
    label:'IndexedDB',
    detail:state.hasLegacyCopy?'Your earlier local-storage record is retained unchanged as a recovery copy.':'Your ledger uses the browser database; no pre-migration local-storage copy was present.',
    canRecoverLegacy:state.hasLegacyCopy,
  };
  return {label:'localStorage fallback',detail:'IndexedDB was unavailable, so Pocket Ledger is continuing with its previous browser storage.',canRecoverLegacy:false};
}
function recoverLegacyStorageCopy(){
  if(IN_CLAUDE||!BROWSER_STORAGE)return;
  const raw=BROWSER_STORAGE.getLegacyCopy();let clean;
  try{clean=normaliseDB(JSON.parse(raw||''));}catch(e){toast('The pre-IndexedDB copy is missing or invalid','error');return;}
  const audit=PocketLedgerRules.auditRules(clean.rules,clean.categories);
  openModal(`<div class="modal-head"><h3>Recover the pre-IndexedDB copy?</h3></div><div class="modal-body">
    <p style="margin:0 0 8px;color:var(--ink-soft);font-size:13px;">This recovery copy contains <strong>${clean.transactions.length}</strong> transactions and <strong>${audit.count}</strong> rules. It was frozen when IndexedDB was first enabled.</p>
    <p style="margin:0;color:var(--ink-soft);font-size:13px;">Your current ledger will be replaced. Export it first if you may need to return to it.</p>
  </div><div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-confirm">Recover copy</button></div>`);
  document.getElementById('m-cancel').onclick=closeModal;document.getElementById('m-confirm').onclick=async()=>{
    savePreRestoreSnapshot();DB=clean;await persist();closeModal();renderContent();toast('Pre-IndexedDB copy recovered');
  };
}
function hasPreRestoreSnapshot(){
  try{ return !!window.localStorage.getItem(PRE_RESTORE_KEY); }catch(e){ return false; }
}
function savePreRestoreSnapshot(){
  try{ window.localStorage.setItem(PRE_RESTORE_KEY, JSON.stringify({savedAt:new Date().toISOString(),data:DB})); return true; }
  catch(e){ return false; }
}
function recoverPreRestoreSnapshot(){
  let snapshot;
  try{ snapshot=JSON.parse(window.localStorage.getItem(PRE_RESTORE_KEY)||'null'); }
  catch(e){ snapshot=null; }
  if(!snapshot || !snapshot.data){ toast('No recovery snapshot is available','error'); return; }
  let clean;
  try{ clean=normaliseDB(snapshot.data); }catch(e){ toast(`Recovery snapshot is invalid: ${e.message}`,'error'); return; }
  openModal(`<div class="modal-head"><h3>Recover pre-restore data?</h3></div><div class="modal-body"><p style="margin:0;color:var(--ink-soft);font-size:13px;">This restores ${clean.transactions.length} transactions saved ${timeAgoLabel(snapshot.savedAt)}. Your current ledger will be replaced.</p></div><div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-confirm">Recover</button></div>`);
  document.getElementById('m-cancel').onclick=closeModal;
  document.getElementById('m-confirm').onclick=()=>{ DB=clean;scheduleSave();closeModal();renderContent();toast('Pre-restore data recovered'); };
}
function handleRestoreFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ toast('That file isn\u2019t valid JSON — is it a Pocket Ledger backup?', 'error'); return; }
    let clean;
    try{ clean=normaliseDB(parsed); }
    catch(err){ toast(`Backup validation failed: ${err.message}`, 'error'); return; }
    const currentCount = DB.transactions.length;
    const ruleAudit=PocketLedgerRules.auditRules(clean.rules,clean.categories);
    openModal(`
      <div class="modal-head"><h3>Restore this backup?</h3></div>
      <div class="modal-body">
        <p style="margin:0 0 8px;color:var(--ink-soft);font-size:13px;">
          This file contains <strong>${clean.transactions.length}</strong> transaction${clean.transactions.length===1?'':'s'}, ${clean.categories.length} categories and <strong>${ruleAudit.count} auto-tagging rules</strong>. ${ruleAudit.directional.length?`${ruleAudit.directional.length} direction-specific rule${ruleAudit.directional.length===1?' is':'s are'} preserved.`:''}
        </p>
        ${ruleAudit.invalid.length||ruleAudit.missingCategories.length||ruleAudit.conflicts.length?`<p style="margin:8px 0 0;color:var(--expense);font-size:12px;">Rule integrity warning: ${ruleAudit.invalid.length} invalid, ${ruleAudit.missingCategories.length} missing a category and ${ruleAudit.conflicts.length} conflicting duplicate${ruleAudit.conflicts.length===1?'':'s'}.</p>`:''}
        <p style="margin:0;color:var(--ink-soft);font-size:13px;">
          ${currentCount ? `Your current ${currentCount} transaction${currentCount===1?'':'s'} on this device will be <strong>replaced</strong> — export a backup first if you want to keep them.` : 'This device currently has no data, so nothing will be lost.'}
        </p>
      </div>
      <div class="modal-foot"><button class="btn" id="m-cancel3">Cancel</button><button class="btn btn-primary" id="m-confirm3">Restore backup</button></div>
    `);
    document.getElementById('m-cancel3').onclick = closeModal;
    document.getElementById('m-confirm3').onclick = ()=>{
      savePreRestoreSnapshot();
      DB = clean;
      scheduleSave(); closeModal(); renderContent();
      toast(`Restored ${clean.transactions.length} transactions`);
    };
  };
  reader.onerror = ()=> toast('Could not read that file', 'error');
  reader.readAsText(file);
}
function exportBackup(){
  syncLegacyAccounts();
  DB.lastBackupAt = new Date().toISOString();
  DB.appVersion = APP_VERSION;
  DB.schemaVersion = SCHEMA_VERSION;
  scheduleSave();
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `pocket-ledger-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup downloaded');
}

/* =========================================================
   INIT
   ========================================================= */
let appStarted = false;
function startApp(){
  if(appStarted) return;
  appStarted = true;

  document.getElementById('nav').addEventListener('click', (e)=>{
    const b = e.target.closest('.nav-item'); if(!b) return;
    setTab(b.dataset.tab);
  });
  document.getElementById('btn-settings').onclick = openSettingsModal;
  document.getElementById('btn-export').onclick = exportBackup;
  document.getElementById('btn-theme-toggle').onclick = ()=>{
    setThemePref(isDarkMode() ? 'light' : 'dark');
    applyTheme();
    renderContent();
  };
  updateThemeToggleIcon();

  setTab('dashboard');

  // Register service worker if this file is being served from a real origin
  // (this silently does nothing inside a sandboxed preview — that's expected).
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* not hosted standalone — fine */ });
  }
}
async function init(){
  const loaded = await loadDB();
  checkStorageHealth();
  try{ DB = loaded ? normaliseDB(loaded) : buildSeedDB(); }
  catch(e){
    console.error('Could not migrate saved data',e);
    DB = buildSeedDB();
    setTimeout(()=>toast(`Saved data could not be loaded: ${e.message}`, 'error', {duration:7000}),50);
  }
  if(!DB.wishlist) DB.wishlist = [];
  if(!DB.dismissedRecurring) DB.dismissedRecurring = [];
  if(!DB.regularCategories) DB.regularCategories = [];
  if(!DB.recurringItems) DB.recurringItems = [];
  if(!DB.savingsGoals) DB.savingsGoals = [];
  if(!DB.budgets) DB.budgets = {};
  if(!DB.accountStartingBalances) DB.accountStartingBalances = {};
  if(!DB.merchantAliases) DB.merchantAliases = {};
  if(!DB.accounts) DB.accounts = [];
  if(!DB.accountRecords) DB.accountRecords = [];
  if(!DB.discretionaryCategories) DB.discretionaryCategories = [];
  if(!DB.investmentCategories) DB.investmentCategories = [];
  if(!DB.pendingCards) DB.pendingCards = [];
  if(!DB.netWorthSnapshots) DB.netWorthSnapshots = [];
  if(!DB.investmentValuations) DB.investmentValuations = [];
  if(DB.lastImport === undefined) DB.lastImport = null;
  if(!loaded || (loaded.schemaVersion||1)!==SCHEMA_VERSION) scheduleSave();

  if(!IN_CLAUDE&&BROWSER_STORAGE&&BROWSER_STORAGE.status().migrated){
    setTimeout(()=>toast('Existing data moved to IndexedDB and verified; the original recovery copy was kept','success',{duration:5000}),80);
  }
  if(DB.lastAccountMigration&&DB.lastAccountMigration.kind==='legacy-imported'){
    const migration=DB.lastAccountMigration;
    setTimeout(()=>toast(`Moved ${migration.count} imported transaction${migration.count===1?'':'s'} into ${migration.target}`,'success',{duration:6500}),140);
  }

  if(isLockEnabled()){
    showLockScreen();
    // startApp() runs the first time hideLockScreen() succeeds — see below.
  } else {
    startApp();
  }
}
function checkStorageHealth(){
  if(IN_CLAUDE) return; // Claude's own storage is handled separately and reliably.

  const banner = document.getElementById('storage-warning');
  const textEl = document.getElementById('storage-warning-text');

  if(location.protocol === 'file:'){
    textEl.innerHTML = `<strong>Your data won't save.</strong> You're opening this file directly (file://) — browsers block persistent storage for local files like this, even if you install it as a desktop app from here (the app still points at this same file://, so the problem follows it). Serve it over http(s) instead: run <code style="background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;">python3 -m http.server</code> in this folder and open <code style="background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;">http://localhost:8000</code>, or host it online (GitHub Pages, Netlify) — then install from that address instead.`;
    banner.classList.remove('hidden');
    return;
  }
  if(BROWSER_STORAGE&&BROWSER_STORAGE.status().mode==='indexeddb')return;
  try{
    const testKey = '__pocketledger_storage_test__';
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
  }catch(e){
    textEl.innerHTML = `<strong>Your data won't save.</strong> This browser is blocking local storage for this page (common in private/incognito windows, or with strict tracking-protection settings). Try a normal browser window, or a different browser.`;
    banner.classList.remove('hidden');
    return;
  }
}
const dismissBtn = document.getElementById('storage-warning-dismiss');
if(dismissBtn) dismissBtn.onclick = ()=> document.getElementById('storage-warning').classList.add('hidden');
init();
</script>
