<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Ledger</title>
<meta name="theme-color" content="#0B6E4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<!-- Chart.js and PapaParse are vendored locally in vendor/ rather than loaded from a CDN,
     so a compromised or tampered third-party file can't run inside an app that holds your
     bank transaction data. Keep these in sync if you ever bump versions. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/papaparse.min.js"></script>
<script src="js/rules.js"></script>
<script src="js/storage.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#F1F3EF;
  --surface:#FFFFFF;
  --surface-2:#F7F8F4;
  --ink:#152420;
  --ink-soft:#57685E;
  --ink-faint:#93A199;
  --line:#DCE3DA;
  --line-strong:#C4CDC1;
  --brand:#0B6E4F;
  --brand-ink:#08432F;
  --brand-wash:#E4EFE7;
  --gold:#A9791F;
  --gold-wash:#F4ECD8;
  --income:#1E8E5A;
  --income-wash:#E7F5EC;
  --expense:#B3392E;
  --expense-wash:#FBEAE7;
  --split:#2563EB;
  --split-wash:#E5EDFC;
  --focus:#2563EB;
  --radius-sm:6px;
  --radius:12px;
  --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(21,36,32,.06);
  --shadow:0 4px 16px rgba(21,36,32,.08), 0 1px 3px rgba(21,36,32,.06);
  --shadow-lg:0 12px 40px rgba(21,36,32,.16), 0 2px 8px rgba(21,36,32,.08);
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  --sidebar-w:230px;
}

/* Dark theme — applied via data-theme="dark" on <html>, set from JS based on
   the user's saved preference (or system preference, if set to "Auto"). The
   sidebar and toast notifications are deliberately excluded — they're a
   fixed dark-green "brand chrome" in both themes, so nothing there needs to
   change. Every other colour is a CSS variable, so overriding them here is
   enough to re-theme the whole app without touching individual rules —
   Chart.js/SVG-drawn colours are the exception, handled separately in JS. */
[data-theme="dark"]{
  --bg:#12160F;
  --surface:#1B211C;
  --surface-2:#232A24;
  --ink:#EAF1EC;
  --ink-soft:#A9B7AE;
  --ink-faint:#6E7C72;
  --line:#333C34;
  --line-strong:#48544A;
  --brand:#2FBE8A;
  --brand-wash:#173629;
  --gold:#E3AC4E;
  --gold-wash:#3C2E12;
  --income:#3FD695;
  --income-wash:#123424;
  --expense:#F17164;
  --expense-wash:#3B1917;
  --split:#6699FF;
  --split-wash:#1B2B4D;
  --focus:#6699FF;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 4px 16px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 12px 40px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
}
[data-theme="dark"] #storage-warning{ border-bottom-color:#5C4622; color:#F4DFA8; }
[data-theme="dark"] #storage-warning-dismiss{ color:#F4DFA8; }
[data-theme="dark"] .btn-danger{ border-color:#5C2A24; }
[data-theme="dark"] .btn-danger:hover{ background:#43201C; }

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; }
a{ color:inherit; }
::selection{ background:var(--brand); color:#fff; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }
.num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
.hidden{ display:none !important; }
.visually-hidden{ position:absolute; width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0); }

/* ---------- App lock screen ---------- */
.lock-screen{
  position:fixed; inset:0; z-index:200; background:var(--bg);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.lock-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg); width:100%; max-width:340px; padding:28px 26px; text-align:center;
}
.lock-card h2{ font-family:var(--font-display); font-size:22px; font-weight:600; margin:0 0 4px; }
.lock-card p{ color:var(--ink-soft); font-size:13px; margin:0 0 18px; }
.lock-pin-input{
  width:100%; text-align:center; letter-spacing:.4em; font-family:var(--font-mono); font-size:20px;
  border:1px solid var(--line-strong); background:var(--surface-2); border-radius:9px;
  padding:12px; margin-bottom:10px;
}
.lock-error{ color:var(--expense); font-size:12.5px; min-height:16px; margin-bottom:10px; }
.lock-card .btn{ width:100%; justify-content:center; margin-bottom:8px; }
.btn-link{
  background:none; border:none; box-shadow:none; color:var(--ink-faint);
  font-size:12px; font-weight:600; text-decoration:underline; padding:4px;
}
.btn-link:hover{ color:var(--ink-soft); }

/* ---------- Storage warning banner ---------- */
#storage-warning{
  background:var(--gold-wash); border-bottom:1px solid #E3CE94; color:#5C4600;
}
.storage-warning-inner{
  max-width:1100px; margin:0 auto; padding:10px 20px;
  display:flex; align-items:center; gap:10px; font-size:13px; font-weight:500;
}
.storage-warning-inner strong{ font-weight:700; }
#storage-warning-dismiss{
  margin-left:auto; background:none; border:none; color:#5C4600; font-size:20px;
  line-height:1; padding:0 4px; opacity:.6;
}
#storage-warning-dismiss:hover{ opacity:1; }

/* ---------- App shell ---------- */
#app{ display:flex; min-height:100vh; }

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--brand-ink);
  color:#EAF3EE;
  display:flex;
  flex-direction:column;
  padding:22px 16px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex; align-items:center; gap:10px;
  margin-bottom:28px; padding:0 6px;
}
.brand-mark{
  width:34px;height:34px; border-radius:50%;
  background:var(--gold-wash);
  color:var(--brand);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:17px;
  border:2px solid rgba(255,255,255,.25);
  flex-shrink:0;
}
.brand-text{ font-family:var(--font-display); font-weight:600; font-size:18px; letter-spacing:.01em; color:#fff;}
.brand-sub{ font-size:10.5px; color:#9FC2AE; text-transform:uppercase; letter-spacing:.09em; margin-top:1px;}

.nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:10px 12px; border-radius:9px;
  background:transparent; border:none; color:#CFE3D8;
  text-align:left; font-size:13.5px; font-weight:500;
  transition:background .15s ease, color .15s ease;
}
.nav-item svg{ width:17px; height:17px; flex-shrink:0; opacity:.85; }
.nav-item:hover{ background:rgba(255,255,255,.07); color:#fff; }
.nav-item.active{ background:#EAF3EE; color:var(--brand-ink); font-weight:600; }
.nav-item.active svg{ opacity:1; }
.nav-badge{
  margin-left:auto; background:var(--gold); color:#2B1E00;
  font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:20px;
}
.nav-item.active .nav-badge{ background:var(--brand); color:#fff; }

.sidebar-foot{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.balance-chip{
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
  border-radius:11px; padding:12px 13px;
}
.balance-chip .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#9FC2AE; }
.balance-chip .val{ font-family:var(--font-mono); font-size:19px; font-weight:600; color:#fff; margin-top:3px; }
.icon-btn-row{ display:flex; gap:6px; }
.icon-btn{
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
  color:#CFE3D8; border-radius:8px; padding:7px; display:flex; align-items:center; justify-content:center;
  flex:1;
}
.icon-btn:hover{ background:rgba(255,255,255,.15); color:#fff; }
.icon-btn svg{ width:15px;height:15px; }

/* ---------- Main ---------- */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  padding:20px 30px 0; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.page-title{ font-family:var(--font-display); font-size:26px; font-weight:600; letter-spacing:-.01em; }
.page-sub{ color:var(--ink-soft); font-size:13px; margin-top:2px; }
.content{ padding:18px 30px 60px; flex:1; }

.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 15px; border-radius:9px; border:1px solid var(--line-strong);
  background:var(--surface); font-weight:600; font-size:13px; color:var(--ink);
  box-shadow:var(--shadow-sm);
  transition:transform .1s ease, box-shadow .15s ease, background .15s ease;
}
.btn:hover{ background:var(--surface-2); }
.btn:active{ transform:translateY(1px); }
.btn svg{ width:15px;height:15px; }
.btn-primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
.btn-primary:hover{ background:var(--brand-ink); }
.btn-ghost{ background:transparent; border-color:transparent; box-shadow:none; color:var(--ink-soft); }
.btn-ghost:hover{ background:var(--surface-2); color:var(--ink); }
.btn-danger{ color:var(--expense); border-color:#EFC9C4; background:var(--expense-wash); }
.btn-danger:hover{ background:#F6DAD6; }
.btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:7px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* ---------- Cards / KPIs ---------- */
.ledger-band{
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--line) 28px);
  border-radius:var(--radius-lg);
  padding:1px;
}
.kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
.kpi-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 17px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
}
.kpi-card .stripe{ position:absolute; left:0; top:0; bottom:0; width:4px; }
.kpi-card.income .stripe{ background:var(--income); }
.kpi-card.expense .stripe{ background:var(--expense); }
.kpi-card.net .stripe{ background:var(--brand); }
.kpi-card.balance .stripe{ background:var(--gold); }
.kpi-lbl{ font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); font-weight:600; }
.kpi-val{ font-family:var(--font-mono); font-size:25px; font-weight:600; margin-top:6px; letter-spacing:-.01em; }
.kpi-val.income{ color:var(--income); }
.kpi-val.expense{ color:var(--expense); }
.kpi-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:3px; }

.seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:3px; gap:2px; }
.seg button{ border:none; background:transparent; padding:6px 13px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--ink-soft); }
.seg button.active{ background:var(--surface); color:var(--brand); box-shadow:var(--shadow-sm); }

.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow-sm);
}
.panel + .panel{ margin-top:16px; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
.panel-title{ font-family:var(--font-display); font-weight:600; font-size:16.5px; }
.panel-title small{ display:block; font-family:var(--font-body); font-weight:400; font-size:11.5px; color:var(--ink-faint); text-transform:none; margin-top:1px;}

.grid-2{ display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start; }
.chart-wrap{ position:relative; height:250px; }
.chart-wrap.donut{ height:220px; }

.legend-list{ display:flex; flex-direction:column; gap:8px; margin-top:12px; max-height:210px; overflow:auto; padding-right:4px;}
.legend-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; }
.legend-dot{ width:9px;height:9px;border-radius:50%; flex-shrink:0; }
.legend-name{ flex:1; color:var(--ink); }
.legend-amt{ font-family:var(--font-mono); font-weight:600; }
.legend-pct{ color:var(--ink-faint); width:38px; text-align:right; font-family:var(--font-mono); }

/* ---------- Stamp badges ---------- */
.stamp{
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 10px 3px 8px; border-radius:20px;
  border:1.5px solid currentColor; font-size:11.5px; font-weight:700;
  text-transform:uppercase; letter-spacing:.03em;
  transform:rotate(-1deg);
  white-space:nowrap;
}
.stamp::before{ content:''; width:5px;height:5px;border-radius:50%; background:currentColor; }
.stamp.c-income{ color:var(--income); background:var(--income-wash); }
.stamp.c-expense{ color:var(--expense); background:var(--expense-wash); }
.stamp.c-none{ color:var(--ink-faint); background:var(--surface-2); border-style:dashed; }
.stamp.c-transfer{ color:var(--gold); background:var(--gold-wash); }
.stamp.c-split{ color:var(--split); background:var(--split-wash); }
.status-pill{ display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 8px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap; }
.status-pill::before{ content:'';width:6px;height:6px;border-radius:50%;background:currentColor; }
.status-pending{ color:var(--gold);background:var(--gold-wash); }
.status-cleared{ color:var(--brand);background:var(--brand-wash); }
.status-reconciled{ color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line); }
.cat-badge-clickable{ cursor:pointer; transition:box-shadow .12s ease; }
.cat-badge-clickable:hover{ box-shadow:0 0 0 2px currentColor inset; }
td.cat-cell{ white-space:nowrap; }
tr.transfer-row{ background:var(--surface-2); }
tr.transfer-row:hover{ background:var(--gold-wash); }

/* ---------- Table ---------- */
.table-wrap{ overflow:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); }
table{ width:100%; border-collapse:collapse; font-size:13px; min-width:720px; }
thead th{
  text-align:left; padding:10px 14px; background:var(--surface-2); color:var(--ink-soft);
  font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
  border-bottom:1px solid var(--line); position:sticky; top:0; cursor:pointer; user-select:none;
  white-space:nowrap;
}
thead th:hover{ color:var(--ink); }
thead th.sorted::after{ content:' ▾'; font-size:9px; }
tbody td{ padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background:var(--surface-2); }
td.amt{ text-align:right; font-family:var(--font-mono); font-weight:600; white-space:nowrap; }
td.amt.income{ color:var(--income); }
td.amt.expense{ color:var(--ink); }
td.desc{ max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
td.row-actions{ text-align:right; white-space:nowrap; }
.row-icon-btn{ background:none;border:none; padding:5px; border-radius:6px; color:var(--ink-faint); }
.row-icon-btn:hover{ background:var(--line); color:var(--ink); }
.row-icon-btn svg{ width:14px;height:14px; }
.cat-select-inline{ border:1px solid var(--line); border-radius:20px; padding:3px 8px; font-size:11.5px; background:var(--surface); }
.empty-row td{ text-align:center; padding:40px 20px; color:var(--ink-faint); }

/* ---------- Filters ---------- */
.filters-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
.field{ display:flex; flex-direction:column; gap:4px; }
.field label{ font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; }
input[type=text], input[type=date], input[type=number], input[type=file], input[type=password], select, textarea{
  border:1px solid var(--line-strong); background:var(--surface); border-radius:8px;
  padding:8px 11px; font-size:13px; color:var(--ink);
}
input:focus, select:focus, textarea:focus{ border-color:var(--brand); }
.search-input{ min-width:220px; }
textarea{ resize:vertical; min-height:60px; }

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(15,26,22,.45); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal{
  background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  width:100%; max-width:460px; max-height:90vh; overflow:auto;
}
.modal.wide{ max-width:900px; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line); }
.modal-head h3{ margin:0; font-family:var(--font-display); font-size:18px; font-weight:600; }
.modal-body{ padding:20px 22px; }
.modal-foot{ padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.form-grid .span2{ grid-column:1/-1; }

/* ---------- Wizard (import) ---------- */
.steps{ display:flex; align-items:center; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
.step-pill{ display:flex; align-items:center; gap:7px; padding:6px 12px 6px 6px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line); font-size:12px; font-weight:600; color:var(--ink-faint); }
.step-pill .n{ width:20px;height:20px;border-radius:50%; background:var(--line); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; }
.step-pill.active{ background:var(--brand-wash); border-color:var(--brand); color:var(--brand); }
.step-pill.active .n{ background:var(--brand); }
.step-pill.done{ color:var(--ink-soft); }
.step-pill.done .n{ background:var(--income); }
.step-arrow{ color:var(--ink-faint); font-size:12px; }

.dropzone{
  border:2px dashed var(--line-strong); border-radius:var(--radius); padding:40px 20px;
  text-align:center; background:var(--surface-2); transition:border-color .15s, background .15s;
}
.dropzone.drag{ border-color:var(--brand); background:var(--brand-wash); }
.dropzone svg{ width:34px;height:34px; color:var(--ink-faint); margin-bottom:8px; }
.dropzone p{ margin:4px 0; color:var(--ink-soft); font-size:13px; }
.dropzone .hint{ font-size:11.5px; color:var(--ink-faint); }

.mapping-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; }
.tag-toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; margin-bottom:10px; font-size:12.5px; }
.tag-toolbar .count{ color:var(--ink-soft); }
.dup-flag{ font-size:10.5px; font-weight:700; color:var(--gold); background:var(--gold-wash); padding:2px 7px; border-radius:20px; }

/* ---------- Toast ---------- */
#toast-host{ position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:200; }
.toast{
  background:var(--brand-ink); color:#fff; padding:11px 16px; border-radius:9px; box-shadow:var(--shadow-lg);
  font-size:13px; font-weight:500; display:flex; align-items:center; gap:8px; max-width:320px;
  animation:toast-in .2s ease;
}
.toast.error{ background:#7A2A22; }
.toast-action{
  background:none; border:1px solid rgba(255,255,255,.45); color:#fff; border-radius:6px;
  padding:4px 10px; font-size:12px; font-weight:600; cursor:pointer; flex-shrink:0; white-space:nowrap;
}
.toast-action:hover{ background:rgba(255,255,255,.12); }
@keyframes toast-in{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

/* ---------- Categories tab ---------- */
.cat-cols{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.cat-list{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
.cat-list-row{ display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; flex-wrap:wrap; }
.budget-input-wrap{ display:flex; align-items:center; gap:4px; font-size:11px; color:var(--ink-soft); white-space:nowrap; }
.budget-input{ width:52px; padding:3px 5px; font-size:11.5px; border-radius:5px; }
.cat-list-row .nm{ flex:1; font-weight:600; font-size:13px; }
.rule-row{ display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:12.5px; }
.rule-row .kw{ font-family:var(--font-mono); background:var(--surface-2); padding:2px 7px; border-radius:5px; }
.rule-row .arrow{ color:var(--ink-faint); }
.rule-row .rc{ flex:1; }
.regular-toggle{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-soft); white-space:nowrap; cursor:pointer; user-select:none; }
.regular-toggle input{ accent-color:var(--brand); cursor:pointer; }

/* ---------- Biggest movers ---------- */
.movers-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.movers-col-title{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:8px; }
.movers-col-title.income{ color:var(--income); }
.movers-col-title.expense{ color:var(--expense); }
.movers-row{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
.movers-row:last-child{ border-bottom:none; }
.movers-rank{ width:18px; height:18px; border-radius:50%; background:var(--surface-2); color:var(--ink-faint); font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.movers-desc{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.movers-amt{ font-family:var(--font-mono); font-weight:600; flex-shrink:0; font-size:12px; }
@media (max-width:560px){ .movers-grid{ grid-template-columns:1fr; } }

/* ---------- Spending plan ---------- */
.recurring-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media (max-width:560px){ .recurring-grid{ grid-template-columns:1fr; } }
.recurring-grid .movers-desc{ white-space:normal; line-height:1.4; }
.stamp-mini{ display:inline-block; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--gold); background:var(--gold-wash); border-radius:4px; padding:1px 5px; vertical-align:middle; }
.upcoming-row{ display:flex; align-items:center; gap:14px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; }
.upcoming-row:last-child{ border-bottom:none; }
.upcoming-date{ width:70px; flex-shrink:0; text-align:center; }
.upcoming-day{ font-size:12px; font-weight:700; color:var(--ink); }
.upcoming-rel{ font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; }
.upcoming-desc{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.upcoming-amt{ font-weight:600; flex-shrink:0; }
.upcoming-subhead{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:700; padding:12px 0 6px; border-top:1px dashed var(--line); margin-top:4px; }
.upcoming-subhead:first-child{ border-top:none; margin-top:0; padding-top:0; }
.qc-result{ margin-top:14px; }
.qc-line{ display:flex; justify-content:space-between; padding:5px 0; font-size:12.5px; color:var(--ink-soft); }
.qc-line .num{ font-family:var(--font-mono); font-weight:600; color:var(--ink); }
.qc-line.qc-total{ border-top:1px solid var(--line); margin-top:4px; padding-top:9px; font-weight:700; font-size:13.5px; color:var(--ink); }
.qc-line.qc-total .num{ font-size:15px; }

/* ---------- Accounts ---------- */
.account-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
.account-card{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
.account-card.unassigned{ border-style:dashed; }
.account-name{ font-size:11.5px; font-weight:600; color:var(--ink-soft); }
.account-balance{ font-size:19px; font-weight:600; margin-top:4px; }
.account-sub{ font-size:10.5px; color:var(--ink-faint); margin-top:2px; }
.reconcile-summary{ display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0; }
.reconcile-figure{ background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px; }
.reconcile-figure .lbl{ font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700; }
.reconcile-figure .val{ font-size:18px;font-weight:600;margin-top:3px; }
.reconcile-row-locked{ opacity:.72; }
@media (max-width:640px){ .reconcile-summary{ grid-template-columns:1fr; } }

/* ---------- Top merchants ---------- */
.merchant-rows{ display:flex; flex-direction:column; gap:10px; }
.merchant-row{ display:flex; align-items:center; gap:12px; }
.merchant-rank{ width:20px; height:20px; border-radius:50%; background:var(--surface-2); color:var(--ink-faint); font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.merchant-mid{ flex:1; min-width:0; }
.merchant-top{ display:flex; justify-content:space-between; gap:10px; margin-bottom:4px; }
.merchant-name{ font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.merchant-amt{ font-size:12.5px; font-weight:600; flex-shrink:0; }
.merchant-bar-track{ height:6px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; }
.merchant-bar-fill{ height:100%; border-radius:20px; background:var(--brand); }
.merchant-count{ font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); flex-shrink:0; width:28px; text-align:right; }

/* ---------- Budgets ---------- */
.budget-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
.budget-row-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.budget-name{ font-size:12.5px; font-weight:600; }
.budget-figures{ font-size:12px; }
.budget-bar-track{ height:7px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; }
.budget-bar-fill{ height:100%; border-radius:20px; transition:width .3s ease; }
.budget-pct{ font-size:10.5px; font-weight:600; margin-top:4px; }

/* ---------- Compare ---------- */
.compare-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:16px; }
.compare-stat{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
.compare-stat-lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:700; }
.compare-stat-val{ font-size:19px; font-weight:600; margin-top:4px; }
.compare-stat-delta{ font-size:11.5px; font-weight:600; margin-top:3px; }
@media (max-width:640px){ .compare-stats{ grid-template-columns:1fr; } }

/* ---------- Empty state ---------- */
.empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
.empty-state svg{ width:40px;height:40px; color:var(--ink-faint); margin-bottom:10px; }
.empty-state h4{ font-family:var(--font-display); font-size:16px; margin:6px 0 4px; color:var(--ink); }

/* ---------- Mobile ---------- */
@media (max-width: 900px){
  .kpi-row{ grid-template-columns:1fr 1fr; }
  .grid-2{ grid-template-columns:1fr; }
  .cat-cols{ grid-template-columns:1fr; }
}
@media (max-width: 720px){

  .sidebar{ position:sticky; top:0; height:auto; width:100%; flex-direction:row; align-items:center; padding:10px 14px; z-index:50; }
  .brand{ margin-bottom:0; }
  .brand-sub{ display:none; }

  .sidebar-foot{ display:flex; flex-direction:row; margin:0; }

  .sidebar-foot .icon-btn-row{ display:flex; }
  .sidebar-foot .icon-btn{ min-width:38px; min-height:38px; }
  .topbar, .content{ padding-left:16px; padding-right:16px; }
  .kpi-row{ grid-template-columns:1fr 1fr; }
  .form-grid{ grid-template-columns:1fr; }
}

/* =========================================================
   POCKET LEDGER — single-file app logic
   ========================================================= */

const APP_VERSION = '1.09';
const SCHEMA_VERSION = 9;
const STORAGE_KEY = 'pocketledger:data:v1';
const PRE_RESTORE_KEY = 'pocketledger_pre_restore_v1';

const ACCOUNT_TYPES = [
  {value:'current', label:'Current account', group:'asset'},
  {value:'savings', label:'Savings account', group:'asset'},
  {value:'cash', label:'Cash', group:'asset'},
  {value:'investment', label:'Investment account', group:'asset'},
  {value:'pension', label:'Pension', group:'asset'},
  {value:'property', label:'Property', group:'asset'},
  {value:'other_asset', label:'Other asset', group:'asset'},
  {value:'credit_card', label:'Credit card', group:'liability'},
  {value:'loan', label:'Loan', group:'liability'},
  {value:'mortgage', label:'Mortgage', group:'liability'},
  {value:'other_liability', label:'Other liability', group:'liability'},
];
function accountTypeConfig(type){ return ACCOUNT_TYPES.find(t=>t.value===type) || ACCOUNT_TYPES[0]; }
function isLiabilityType(type){ return accountTypeConfig(type).group==='liability'; }
function inferAccountType(name){
  const n=String(name||'').toLowerCase();
  if(/credit|card|amex/.test(n)) return 'credit_card';
  if(/mortgage/.test(n)) return 'mortgage';
  if(/loan/.test(n)) return 'loan';
  if(/pension/.test(n)) return 'pension';
  if(/investment|stocks|shares|isa/.test(n)) return 'investment';
  if(/saving/.test(n)) return 'savings';
  if(/cash|wallet/.test(n)) return 'cash';
  return 'current';
}
function makeAccountRecord(name, type, openingBalance, extra){
  return Object.assign({
    id:uid('acct'), name:String(name||'').trim(), type:type||inferAccountType(name), institution:'', currency:'GBP',
    openingBalance:Number(openingBalance)||0, openingBalanceDate:'', creditLimit:null,
    archived:false, includeInNetWorth:true, createdAt:new Date().toISOString(),
  }, extra||{});
}

const DEFAULT_CATEGORIES = [

function uid(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function localISODate(d){
  d = d || new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayISO(){ return localISODate(new Date()); }
function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }
function nextMonthDate(day){
  const now=new Date(),candidate=new Date(now.getFullYear(),now.getMonth(),day);
  if(candidate<=new Date(now.getFullYear(),now.getMonth(),now.getDate())) candidate.setMonth(candidate.getMonth()+1);
  return localISODate(candidate);
}

function buildSeedDB(){
  const tx = [];
  const months = [1,2,3,4,5,6,7];
  let rand = mulberry32(42);
  function rnd(min,max){ return Math.round((min + rand()*(max-min))*100)/100; }
  function pick(arr){ return arr[Math.floor(rand()*arr.length)]; }
  months.forEach(m=>{
    const y = 2026;
    const dstr = (d)=> `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    tx.push({id:uid('tx'), date:dstr(1), description:'Monthly Salary', amount:2450.00, category:'Salary', account:'Current Account', notes:'', source:'sample'});
    if(m%2===0) tx.push({id:uid('tx'), date:dstr(14), description:'Freelance web project', amount:rnd(200,450), category:'Freelance', account:'Current Account', notes:'', source:'sample'});
    tx.push({id:uid('tx'), date:dstr(5), description:'Savings interest', amount:rnd(3,10), category:'Interest', account:'Savings', notes:'', source:'sample'});
    tx.push({id:uid('tx'), date:dstr(1), description:'Rent', amount:-950.00, category:'Rent/Mortgage', account:'Current Account', notes:'', source:'sample'});
    tx.push({id:uid('tx'), date:dstr(3), description:'British Gas - electricity & gas', amount:-rnd(60,110), category:'Utilities', account:'Current Account', notes:'', source:'sample'});
    tx.push({id:uid('tx'), date:dstr(4), description:'BT Internet & phone', amount:-42.00, category:'Utilities', account:'Current Account', notes:'', source:'sample'});

function isPlainObject(value){ return !!value && typeof value==='object' && !Array.isArray(value); }

function finiteNumber(value, fallback){ return Number.isFinite(value) ? value : fallback; }
function normaliseTransaction(raw){
  if(!isPlainObject(raw)) return null;
  const amount = Number(raw.amount);
  if(!validISODate(raw.date) || !Number.isFinite(amount) || !String(raw.description||'').trim()) return null;
  const status = ['pending','cleared','reconciled'].includes(raw.status) ? raw.status : 'cleared';
  const clean = Object.assign({}, raw, {
    id: typeof raw.id==='string' && raw.id ? raw.id : uid('tx'),
    date: raw.date,
    description: String(raw.description).trim(),
    amount,
    category: typeof raw.category==='string' ? raw.category : '',
    account: typeof raw.account==='string' ? raw.account : '',
    notes: typeof raw.notes==='string' ? raw.notes : '',
    source: typeof raw.source==='string' ? raw.source : 'restored',
    status,
    excluded: !!raw.excluded,
  });

    clean.splits = raw.splits.map(s=> isPlainObject(s) && Number.isFinite(Number(s.amount)) ? {
      id: typeof s.id==='string' && s.id ? s.id : uid('split'),
      category: typeof s.category==='string' ? s.category : '',
      amount: Number(s.amount),
    } : null).filter(Boolean);
  }

}
function normaliseAccountRecord(raw){

  const openingBalance=Number(raw.openingBalance);
  const creditLimit=raw.creditLimit==null || raw.creditLimit==='' ? null : Number(raw.creditLimit);
  return makeAccountRecord(raw.name,type,Number.isFinite(openingBalance)?openingBalance:0,{
    id:typeof raw.id==='string'&&raw.id?raw.id:uid('acct'),
    institution:typeof raw.institution==='string'?raw.institution:'',
    currency:typeof raw.currency==='string'&&raw.currency?raw.currency:'GBP',
    openingBalanceDate:validISODate(raw.openingBalanceDate)?raw.openingBalanceDate:'',
    creditLimit:Number.isFinite(creditLimit)&&creditLimit>0?creditLimit:null,
    archived:!!raw.archived,
    includeInNetWorth:raw.includeInNetWorth!==false,
    createdAt:typeof raw.createdAt==='string'?raw.createdAt:new Date().toISOString(),

}
const RECURRING_FREQUENCIES=['weekly','fortnightly','four_weekly','monthly','quarterly','semiannual','annual','custom'];
function normaliseRecurringItem(raw){
  if(!isPlainObject(raw) || !String(raw.name||'').trim()) return null;
  const amount=Number(raw.amount),kind=raw.kind==='income'?'income':'expense';
  if(!Number.isFinite(amount)||amount<=0||!validISODate(raw.nextDate)) return null;
  const frequency=RECURRING_FREQUENCIES.includes(raw.frequency)?raw.frequency:'monthly';
  const customDays=frequency==='custom'?Math.max(1,Math.round(Number(raw.customDays)||30)):null;
  const minAmount=raw.minAmount==null||raw.minAmount===''?null:Number(raw.minAmount);
  const maxAmount=raw.maxAmount==null||raw.maxAmount===''?null:Number(raw.maxAmount);
  const endDate=validISODate(raw.endDate)?raw.endDate:'';
  let status=['active','paused','ended'].includes(raw.status)?raw.status:'active';
  if(status==='active'&&endDate&&raw.nextDate>endDate)status='ended';
  return {
    id:typeof raw.id==='string'&&raw.id?raw.id:uid('rec'),name:String(raw.name).trim(),kind,
    category:typeof raw.category==='string'?raw.category:'',account:typeof raw.account==='string'?raw.account:'',amount,
    variable:!!raw.variable,minAmount:Number.isFinite(minAmount)&&minAmount>=0?minAmount:null,maxAmount:Number.isFinite(maxAmount)&&maxAmount>=0?maxAmount:null,

function normaliseSavingsGoal(raw){
  if(!isPlainObject(raw)||!String(raw.name||'').trim())return null;
  const targetAmount=Number(raw.targetAmount);if(!Number.isFinite(targetAmount)||targetAmount<=0)return null;
  const activity=Array.isArray(raw.activity)?raw.activity.map(entry=>{
    if(!isPlainObject(entry)||!validISODate(entry.date)||!Number.isFinite(Number(entry.amount))||Number(entry.amount)===0)return null;
    return {id:typeof entry.id==='string'&&entry.id?entry.id:uid('ga'),date:entry.date,amount:Number(entry.amount),notes:typeof entry.notes==='string'?entry.notes:''};
  }).filter(Boolean):[];
  return {
    id:typeof raw.id==='string'&&raw.id?raw.id:uid('goal'),name:String(raw.name).trim(),
    type:raw.type==='sinking_fund'?'sinking_fund':'goal',targetAmount,targetDate:validISODate(raw.targetDate)?raw.targetDate:'',
    account:typeof raw.account==='string'?raw.account:'',priority:['high','medium','low'].includes(raw.priority)?raw.priority:'medium',
    status:raw.status==='paused'?'paused':'active',notes:typeof raw.notes==='string'?raw.notes:'',
    createdAt:typeof raw.createdAt==='string'?raw.createdAt:new Date().toISOString(),activity,
  };
}
function normaliseInvestmentValuation(raw,accountRecords){
  if(!isPlainObject(raw)||!validISODate(raw.date)||!Number.isFinite(Number(raw.value))||Number(raw.value)<0)return null;
  const record=accountRecords.find(r=>r.id===raw.accountId)||accountRecords.find(r=>r.name===raw.accountName);
  if(!record||!['investment','pension'].includes(record.type))return null;
  return {
    id:typeof raw.id==='string'&&raw.id?raw.id:uid('val'),accountId:record.id,accountName:record.name,
    date:raw.date,value:Number(raw.value),currency:typeof raw.currency==='string'&&raw.currency?raw.currency:(record.currency||'GBP'),
    source:['manual','csv','api'].includes(raw.source)?raw.source:'manual',notes:typeof raw.notes==='string'?raw.notes:'',
    createdAt:typeof raw.createdAt==='string'?raw.createdAt:new Date().toISOString(),updatedAt:typeof raw.updatedAt==='string'?raw.updatedAt:null,
  };
}
function migrateAccountRecords(raw, transactions){
  const records=Array.isArray(raw.accountRecords) ? raw.accountRecords.map(normaliseAccountRecord).filter(Boolean) : [];
  const migratedFromLegacy=records.length===0;
  const names=new Set();
  (Array.isArray(raw.accounts)?raw.accounts:[]).forEach(n=>{if(typeof n==='string'&&n.trim())names.add(n.trim());});
  if(isPlainObject(raw.accountStartingBalances)) Object.keys(raw.accountStartingBalances).forEach(n=>names.add(n));
  transactions.forEach(t=>{if(t.account)names.add(t.account);});
  let position=0;
  names.forEach(name=>{
    if(records.some(r=>r.name.toLowerCase()===name.toLowerCase())) return;
    let opening=0;
    if(isPlainObject(raw.accountStartingBalances)&&Object.prototype.hasOwnProperty.call(raw.accountStartingBalances,name)) opening=Number(raw.accountStartingBalances[name])||0;
    else if(migratedFromLegacy&&position===0) opening=Number(raw.startingBalance)||0;
    records.push(makeAccountRecord(name,inferAccountType(name),opening));
    position++;
  });
  return records;
}
function isLegacyImportedAccount(name){return String(name||'').trim().toLowerCase()==='imported';}
function preferredCurrentAccountNameFromRaw(raw,transactions){
  const names=[];
  const add=name=>{name=String(name||'').trim();if(name&&!isLegacyImportedAccount(name)&&!names.some(n=>n.toLowerCase()===name.toLowerCase()))names.push(name);};
  (Array.isArray(raw.accountRecords)?raw.accountRecords:[]).filter(r=>r&&r.type==='current'&&!r.archived).forEach(r=>add(r.name));
  if(isPlainObject(raw.accountStartingBalances))Object.keys(raw.accountStartingBalances).forEach(add);
  (Array.isArray(raw.accounts)?raw.accounts:[]).forEach(add);transactions.forEach(t=>add(t.account));
  return names.find(n=>n.toLowerCase()==='current account')||names[0]||'Current Account';
}
function migrateLegacyImportedAssignments(raw,transactions){
  const count=transactions.filter(t=>isLegacyImportedAccount(t.account)).length;
  if(!count)return {count:0,target:''};
  const target=preferredCurrentAccountNameFromRaw(raw,transactions);
  transactions.forEach(t=>{if(isLegacyImportedAccount(t.account)){t.account=target;delete t.accountId;}});
  return {count,target};
}
function normaliseDB(raw){
  if(!isPlainObject(raw)) throw new Error('The backup does not contain a ledger object.');
  if(!Array.isArray(raw.transactions) || !Array.isArray(raw.categories)) throw new Error('Transactions or categories are missing.');
  const transactions=raw.transactions.map(normaliseTransaction);
  const invalidTransactions = transactions.filter(t=>!t).length;
  if(invalidTransactions) throw new Error(`${invalidTransactions} transaction${invalidTransactions===1?' is':'s are'} invalid.`);
  const importedMigration=migrateLegacyImportedAssignments(raw,transactions);
  const accountRecords=migrateAccountRecords(raw,transactions).filter(r=>!isLegacyImportedAccount(r.name));
  const base = buildEmptyDB();
  const clean = Object.assign(base, {
    schemaVersion: SCHEMA_VERSION,
    appVersion: APP_VERSION,
    startingBalance: finiteNumber(Number(raw.startingBalance), 0),
    categories: raw.categories.filter(c=>isPlainObject(c) && typeof c.name==='string' && ['income','expense'].includes(c.kind)).map(c=>({name:c.name,kind:c.kind})),
    rules: PocketLedgerRules.normaliseRules(raw.rules),
    transactions,
    wishlist: Array.isArray(raw.wishlist) ? raw.wishlist.filter(isPlainObject) : [],
    dismissedRecurring: Array.isArray(raw.dismissedRecurring) ? raw.dismissedRecurring.filter(x=>typeof x==='string') : [],
    regularCategories: Array.isArray(raw.regularCategories) ? raw.regularCategories.filter(x=>typeof x==='string') : [],
    recurringItems: Array.isArray(raw.recurringItems) ? raw.recurringItems.map(normaliseRecurringItem).filter(Boolean) : [],
    savingsGoals: Array.isArray(raw.savingsGoals) ? raw.savingsGoals.map(normaliseSavingsGoal).filter(Boolean) : [],
    budgets: isPlainObject(raw.budgets) ? raw.budgets : {},
    accountStartingBalances: isPlainObject(raw.accountStartingBalances) ? raw.accountStartingBalances : {},
    merchantAliases: isPlainObject(raw.merchantAliases) ? raw.merchantAliases : {},
    accounts: Array.isArray(raw.accounts) ? raw.accounts.filter(x=>typeof x==='string') : [],
    accountRecords,
    discretionaryCategories: Array.isArray(raw.discretionaryCategories) ? raw.discretionaryCategories.filter(x=>typeof x==='string') : [],
    investmentCategories: Array.isArray(raw.investmentCategories) ? raw.investmentCategories.filter(x=>typeof x==='string') : [],
    pendingCards: Array.isArray(raw.pendingCards) ? raw.pendingCards.filter(isPlainObject) : [],
    reconciliations: isPlainObject(raw.reconciliations) ? raw.reconciliations : {},
    lastBackupAt: typeof raw.lastBackupAt==='string' ? raw.lastBackupAt : null,
    lastImport: isPlainObject(raw.lastImport) ? raw.lastImport : null,
    netWorthSnapshots:Array.isArray(raw.netWorthSnapshots) ? raw.netWorthSnapshots.filter(s=>isPlainObject(s)&&validISODate(s.date)&&Number.isFinite(Number(s.netWorth))).map(s=>Object.assign({},s,{netWorth:Number(s.netWorth),totalAssets:Number(s.totalAssets)||0,totalLiabilities:Number(s.totalLiabilities)||0})) : [],
    investmentValuations:Array.isArray(raw.investmentValuations) ? raw.investmentValuations.map(v=>normaliseInvestmentValuation(v,accountRecords)).filter(Boolean) : [],
  });
  if(importedMigration.count){
    clean.recurringItems.forEach(item=>{if(isLegacyImportedAccount(item.account))item.account=importedMigration.target;});
    clean.savingsGoals.forEach(goal=>{if(isLegacyImportedAccount(goal.account))goal.account=importedMigration.target;});
    if(clean.lastImport&&isLegacyImportedAccount(clean.lastImport.account))clean.lastImport.account=importedMigration.target;
    if(clean.reconciliations.Imported){

      existing.history=[...(existing.history||[]),...(clean.reconciliations.Imported.history||[])];clean.reconciliations[importedMigration.target]=existing;delete clean.reconciliations.Imported;

let DB = null;
let saveTimer = null;
// window.storage is a Claude-only API. When this app is self-hosted (GitHub
// Pages, etc.) and installed as a PWA, that API doesn't exist — so we use
// IndexedDB. The v1 localStorage record is retained unchanged as a recovery
// copy after its contents have been written and read back verbatim.
const IN_CLAUDE = !!(window.storage && window.storage.get && window.storage.set);
const LOCAL_KEY = 'pocketledger_data_v1';
let BROWSER_STORAGE=null;
async function browserStorage(){
  if(!BROWSER_STORAGE){
    BROWSER_STORAGE=PocketLedgerStorage.create({indexedDB:window.indexedDB,localStorage:window.localStorage,localKey:LOCAL_KEY,dbName:'pocketledger',storeName:'ledger'});
    await BROWSER_STORAGE.init();
  }
  return BROWSER_STORAGE;
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 450);
}
async function persist(){
  if(DB&&DB.accountRecords) syncLegacyAccounts();
  const json = JSON.stringify(DB);
  try{
    if(IN_CLAUDE){
      await window.storage.set(STORAGE_KEY, json, false);
    } else await (await browserStorage()).save(json);
  }catch(e){
    console.error('save failed', e);
    toast('Could not save changes — try again in a moment', 'error');
  }
}
async function loadDB(){
  try{
    if(IN_CLAUDE){
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value) return JSON.parse(res.value);
      return null;
    }
    const raw=await (await browserStorage()).load();
    if(raw)return JSON.parse(raw);
  }catch(e){ /* key not found, storage unavailable, or corrupt JSON */ }
  return null;
}

/* ---------- Theme (light / dark / auto) ----------
   Stored separately from the main DB, same pattern as the app lock — it's a
   device/browser preference, not ledger data, so it doesn't belong in
   backups or sync with it. Applied as data-theme="light"|"dark" on <html>;
   "auto" resolves to whichever the OS prefers and stays live if that changes
   while the app is open. */
const THEME_KEY = 'pocketledger_theme_v1';
function getThemePref(){
  try{ return window.localStorage.getItem(THEME_KEY) || 'auto'; }catch(e){ return 'auto'; }
}
function setThemePref(mode){
  try{ window.localStorage.setItem(THEME_KEY, mode); }catch(e){ /* ignore */ }
}
function systemPrefersDark(){
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function resolvedTheme(){
  const pref = getThemePref();
  return pref==='auto' ? (systemPrefersDark() ? 'dark' : 'light') : pref;
}
function isDarkMode(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }
function applyTheme(){
  document.documentElement.setAttribute('data-theme', resolvedTheme());
  updateThemeToggleIcon();
}
function updateThemeToggleIcon(){
  const btn = document.getElementById('btn-theme-toggle');
  if(!btn) return;
  const dark = isDarkMode();
  btn.innerHTML = dark ? iconSun() : iconMoon();
  btn.title = dark ? 'Switch to light theme' : 'Switch to dark theme';
}
function iconSun(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>`; }
function iconMoon(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>`; }
if(window.matchMedia){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onSystemThemeChange = ()=>{ if(getThemePref()==='auto') applyTheme(); };
  if(mq.addEventListener) mq.addEventListener('change', onSystemThemeChange);
  else if(mq.addListener) mq.addListener(onSystemThemeChange); // older Safari
}
applyTheme(); // set before first paint so the app never flashes the wrong theme

/* ---------- App lock (PIN gate) ----------
   This is a screen lock, not encryption: your data still sits as plain JSON
   in localStorage either way (that's what lets "Forgot PIN?" recover it
   without losing anything). What this protects against is someone picking
   up your unlocked phone/laptop and opening the installed app — it does not
   protect against someone opening browser dev tools on the device itself. */
const LOCK_KEY = 'pocketledger_lock_v1';
const LOCK_SUPPORTED = !!(window.crypto && window.crypto.subtle && window.localStorage);

function randomSaltHex(){
  const bytes = new Uint8Array(16);
  window.crypto.getRandomValues(bytes);
  return Array.from(bytes, b=>b.toString(16).padStart(2,'0')).join('');
}
async function sha256Hex(str){
  const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf), b=>b.toString(16).padStart(2,'0')).join('');
}
function getLockConfig(){
  if(!LOCK_SUPPORTED) return null;
  try{
    const raw = window.localStorage.getItem(LOCK_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function isLockEnabled(){
  const cfg = getLockConfig();
  return !!(cfg && cfg.hash && cfg.salt);
}
async function setPin(pin){
  const salt = randomSaltHex();
  const hash = await sha256Hex(salt + pin);
  window.localStorage.setItem(LOCK_KEY, JSON.stringify({salt, hash}));
}
function removeLock(){
  window.localStorage.removeItem(LOCK_KEY);
}
async function verifyPin(pin){
  const cfg = getLockConfig();
  if(!cfg) return true;
  const hash = await sha256Hex(cfg.salt + pin);
  return hash === cfg.hash;
}

let lockScreenWired = false;
function showLockScreen(){

function gbp(n, opts){
  opts = opts || {};

  const abs = Math.abs(n);
  const str = '£' + abs.toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
  if(opts.signed && n > 0.004) return '+' + str;
  if(neg) return opts.parens ? '(' + str + ')' : '-' + str;

function timeAgoLabel(iso){
  const then = new Date(iso);
  if(isNaN(then)) return '';
  const ms = Date.now() - then.getTime();
  const mins = Math.floor(ms / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins} minute${mins===1?'':'s'} ago`;
  const hours = Math.floor(mins / 60);
  if(hours < 24) return `${hours} hour${hours===1?'':'s'} ago`;
  const days = Math.floor(hours / 24);
  if(days === 1) return 'yesterday';
  if(days < 7) return `${days} days ago`;
  return then.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}

/* ---------- calc helpers ---------- */
function txInRange(from, to){

}
function countsTowardTotals(t){ return !t.transferId && !t.excluded && t.status!=='pending'; }
// A transaction can optionally carry t.splits = [{id, category, amount}, ...]
// instead of a single t.category, when its total is allocated across more
// than one category (e.g. one supermarket trip covering groceries and
// household goods). t.category is blank while split. Anywhere that groups or
// sums by category needs to see the split pieces individually rather than
// the one parent row — categoryRowsFor/expandSplits do that; anything that
// only cares about the total cash amount (sumIncome, sumExpense, balance,
// duplicate detection, merchant grouping) can keep using the plain list,
// since a split doesn't change the transaction's date, account, or total.
function categoryRowsFor(t){
  if(t.splits && t.splits.length){
    return t.splits.map(s=> Object.assign({}, t, {category:s.category, amount:s.amount, splitId:s.id, isSplitPart:true}));
  }
  return [t];
}
function expandSplits(list){
  const out = [];
  list.forEach(t=> categoryRowsFor(t).forEach(r=>out.push(r)));
  return out;
}
function sumIncome(list){ return list.reduce((s,t)=> (t.amount>0 && countsTowardTotals(t)) ? s+t.amount : s, 0); }
function sumExpense(list){ return list.reduce((s,t)=> (t.amount<0 && countsTowardTotals(t)) ? s+Math.abs(t.amount) : s, 0); }
function currentBalance(){
  const liquidTypes=new Set(['current','savings','cash','credit_card']);
  const names=allAccountNames().filter(name=>liquidTypes.has((accountRecordFor(name)||{}).type||'current'));
  const opening = names.length ? names.reduce((sum,name)=>sum+accountOpeningBalance(name),0) : ((DB.accountRecords||[]).length?0:(Number(DB.startingBalance)||0));
  return opening + DB.transactions.reduce((s,t)=> t.status==='pending'||(t.account&&!names.includes(t.account)) ? s : s+t.amount, 0);
}
function accountRecordFor(name){ return (DB.accountRecords||[]).find(r=>r.name===name) || null; }
function allAccountNames(){

/* =========================================================
   INVESTMENT VALUATIONS
   Valuations are end-of-day account checkpoints. They are deliberately
   separate from transactions: market movement changes net worth, but is not
   income or spending. Transactions after the latest checkpoint remain live.

function investmentAccountRecords(){

function accountTransactionsTotal(account,fromExclusive,toInclusive){
  return DB.transactions.reduce((sum,t)=>{
    if(t.account!==account||transactionStatus(t)==='pending')return sum;
    if(fromExclusive&&t.date<=fromExclusive)return sum;
    if(toInclusive&&t.date>toInclusive)return sum;
    return sum+Number(t.amount||0);
  },0);
}
function accountTransferFlow(account,fromExclusive,toInclusive){
  return DB.transactions.reduce((sum,t)=>{
    if(t.account!==account||!t.transferId||transactionStatus(t)==='pending')return sum;
    if(fromExclusive&&t.date<=fromExclusive)return sum;
    if(toInclusive&&t.date>toInclusive)return sum;
    return sum+Number(t.amount||0);
  },0);
}

  const record=accountRecordFor(account),limit=asOfDate||todayISO();
  if(record&&['investment','pension'].includes(record.type)){
    const valuation=latestInvestmentValuation(record.id,limit);
    if(valuation)return valuation.value+accountTransactionsTotal(account,valuation.date,limit);
  }
  const list=DB.transactions.filter(t=>t.account===account&&transactionStatus(t)!=='pending'&&(!asOfDate||t.date<=asOfDate));
  return accountOpeningBalance(account)+list.reduce((sum,t)=>sum+Number(t.amount||0),0);
}
function investmentValuationPerformance(valuation){
  const rows=investmentValuationsForAccount(valuation.accountId),index=rows.findIndex(v=>v.id===valuation.id);
  if(index<=0)return null;
  const previous=rows[index-1],record=(DB.accountRecords||[]).find(r=>r.id===valuation.accountId);
  if(!record)return null;
  const netFlow=accountTransferFlow(record.name,previous.date,valuation.date);
  const gain=valuation.value-previous.value-netFlow;
  return {previous,netFlow,gain,rate:previous.value+Math.max(0,netFlow)>0?gain/(previous.value+Math.max(0,netFlow))*100:0};
}

function perAccountBalances(){
  const accounts = new Set((DB.accountRecords||[]).map(r=>r.name));
  (DB.accounts||[]).forEach(a=>accounts.add(a));
  Object.keys(DB.accountStartingBalances).forEach(a=> accounts.add(a));
  DB.transactions.forEach(t=>{ if(t.account) accounts.add(t.account); });
  const rows = [...accounts].map(account=>{

/* ---------- recurring transaction detection ---------- */
// UK bank statements pad the real merchant name with boilerplate on either
// side — a payment-type prefix ("CARD PAYMENT TO", "DIRECT DEBIT PAYMENT
// TO"...) and often a per-transaction reference/order code suffix ("AMAZON
// PRIME*KJ66U0E55" — a different code every time). Both get stripped before
// the merchant name itself is extracted, so the same merchant groups
// together correctly across transactions.
const DESC_NOISE_PREFIXES = [
  'THIRD PARTY PAYMENT MADE VIA FASTER PAYMENT TO', 'THIRD PARTY PAYMENT MADE VIA FASTER PAYMENT FROM',
  'BILL PAYMENT VIA FASTER PAYMENT TO', 'BILL PAYMENT VIA FASTER PAYMENT FROM',
  'DIRECT DEBIT PAYMENT TO', 'REGULAR TRANSFER PAYMENT TO',
  'FASTER PAYMENTS RECEIPT REF.', 'FASTER PAYMENT RECEIPT REF.',
  'FASTER PAYMENTS RECEIPT', 'FASTER PAYMENT RECEIPT',
  'CONTACTLESS PAYMENT TO', 'DEBIT CARD PAYMENT TO',
  'ONLINE PAYMENT TO', 'STANDING ORDER TO', 'STANDING ORDER',
  'DIRECT DEBIT TO', 'DIRECT DEBIT',
  'THIRD PARTY PAYMENT TO', 'THIRD PARTY PAYMENT',
  'BILL PAYMENT TO', 'BILL PAYMENT FROM', 'BILL PAYMENT VIA', 'BILL PAYMENT',
  'BANK GIRO CREDIT REF', 'BANK GIRO CREDIT',
  'CASH WITHDRAWAL AT', 'CASH WITHDRAWAL', 'ATM WITHDRAWAL AT', 'ATM WITHDRAWAL',
  'CARD PAYMENT TO', 'CARD PAYMENT',
  'TRANSFER TO', 'TRANSFER FROM', 'PAYMENT TO', 'PAYMENT FROM',
].sort((a,b)=> b.length-a.length);
const DESC_NOISE_PHRASES = ['GOOGLE PAY','APPLE PAY','SAMSUNG PAY'];
const DESC_STOP_WORDS = new Set(['REF','REFERENCE','MANDATE','GBP','RATE','ON','VIA','MADE','FROM','TO','AT','NO']);

function stripDescPrefix(s){
  let changed = true, iterations = 0;
  while(changed && iterations<3){
    changed = false;
    for(const p of DESC_NOISE_PREFIXES){
      if(s.startsWith(p)){ s = s.slice(p.length).trim(); changed = true; break; }
    }
    iterations++;
  }
  return s;
}
function normalizeDescForRecurring(desc){
  let s = String(desc||'').toUpperCase().trim();
  s = stripDescPrefix(s);
  // "AMAZON PRIME*KJ66U0E55" / "UBER *TRIP HELP.UBER.C" — everything from the
  // first * onwards is almost always a per-transaction code, not the merchant.
  const starIdx = s.indexOf('*');
  if(starIdx > 0) s = s.slice(0, starIdx).trim();
  DESC_NOISE_PHRASES.forEach(p=>{ s = s.split(p).join(' '); });
  s = s.replace(/[0-9]/g,' ').replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
  const words = s.split(' ').filter(w=> w && !DESC_STOP_WORDS.has(w));
  const deduped = words.filter((w,i)=> words.indexOf(w)===i);
  const result = deduped.slice(0,2).join(' ');
  return result || s.split(' ').filter(Boolean).slice(0,2).join(' ');
}
function daysBetween(a,b){
  return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
}
function recurringKey(descKey, amount){ return descKey+'|'+Math.round(amount); }
function detectRecurring(){
  const byDesc = {};
  DB.transactions.forEach(t=>{
    if(!countsTowardTotals(t)) return;
    if(t.splits && t.splits.length) return; // split transactions don't have one category to cluster on
    const key = normalizeDescForRecurring(t.description);
    if(!key) return;
    (byDesc[key] = byDesc[key] || []).push(t);
  });
  const results = [];
  Object.entries(byDesc).forEach(([descKey, txs])=>{
    if(txs.length < 2) return;
    // Cluster same-description transactions by similar amount (tolerant of a
    // few pence of rounding, but not genuinely different amounts).
    const sorted = [...txs].sort((a,b)=> a.amount-b.amount);
    const clusters = [];
    sorted.forEach(t=>{
      const c = clusters.find(c=> Math.abs(t.amount - c.avg) <= Math.max(1, Math.abs(c.avg)*0.05));
      if(c){ c.items.push(t); c.avg = c.items.reduce((s,x)=>s+x.amount,0)/c.items.length; }
      else clusters.push({avg:t.amount, items:[t]});
    });
    clusters.forEach(c=>{
      if(c.items.length < 2) return;
      const byDate = [...c.items].sort((a,b)=> a.date.localeCompare(b.date));
      const gaps = [];
      for(let i=1;i<byDate.length;i++) gaps.push(daysBetween(byDate[i-1].date, byDate[i].date));
      const avgGap = gaps.reduce((s,g)=>s+g,0)/gaps.length;
      // "Roughly monthly": every gap between 10–45 days, averaging 24–36 days.
      // Loose enough to survive weekends/bank holidays shifting a date a bit.
      const plausible = gaps.every(g=> g>=10 && g<=45) && avgGap>=24 && avgGap<=36;
      if(!plausible) return;
      const last = byDate[byDate.length-1];
      results.push({
        key: recurringKey(descKey, c.avg),
        description: last.description,
        amount: c.avg,
        category: last.category,
        account: last.account||'',
        occurrences: byDate.length,
        avgIntervalDays: Math.round(avgGap),
        lastDate: last.date,
        nextExpected: addDays(last.date, Math.round(avgGap)),
      });
    });
  });
  return results.sort((a,b)=> a.amount - b.amount);
}
// detectRecurring() clusters by amount similarity first, which is right for
// its own purpose (matching "the same regular payment") but means a bill
// whose price actually changed gets split into two unrelated clusters
// rather than recognised as one bill that crept up. This groups by
// description only and compares early vs recent amounts directly.
function detectBillCreep(){
  const byDesc = {};
  DB.transactions.forEach(t=>{
    if(!countsTowardTotals(t) || (t.splits && t.splits.length)) return;
    if(t.amount>=0) return;
    const key = normalizeDescForRecurring(t.description);
    if(!key) return;
    (byDesc[key] = byDesc[key] || []).push(t);
  });
  const results = [];
  Object.entries(byDesc).forEach(([descKey, txs])=>{
    if(txs.length < 3) return;
    const byDate = [...txs].sort((a,b)=> a.date.localeCompare(b.date));
    const gaps = [];
    for(let i=1;i<byDate.length;i++) gaps.push(daysBetween(byDate[i-1].date, byDate[i].date));
    const avgGap = gaps.reduce((s,g)=>s+g,0)/gaps.length;
    // Looser than detectRecurring's window — creep detection just needs
    // "roughly monthly", not a strictly unbroken run.
    const plausible = gaps.every(g=> g>=15 && g<=60) && avgGap>=20 && avgGap<=40;
    if(!plausible) return;
    const n = Math.min(2, Math.floor(byDate.length/2)) || 1;
    const avgOf = arr => arr.reduce((s,t)=>s+Math.abs(t.amount),0)/arr.length;
    const firstAmt = avgOf(byDate.slice(0, n));
    const lastAmt = avgOf(byDate.slice(-n));
    const increase = lastAmt - firstAmt;
    const pct = firstAmt>0 ? (increase/firstAmt*100) : 0;
    if(increase <= 1 || pct < 5) return; // ignore rounding noise / trivial changes
    const last = byDate[byDate.length-1];
    results.push({
      description: last.description, category: last.category,
      firstAmt, lastAmt, increase, pct,
      firstDate: byDate[0].date, lastDate: last.date, occurrences: byDate.length,
    });
  });
  return results.sort((a,b)=> b.pct-a.pct);
}
function periodRange(period){
  const now = new Date();
  if(period==='month'){
    const base = new Date(now.getFullYear(), now.getMonth() + UI.dashboardMonthOffset, 1);
    const from = localISODate(base);
    const to = localISODate(new Date(base.getFullYear(), base.getMonth()+1, 0));
    return {from, to, label: base.toLocaleDateString('en-GB',{month:'long', year:'numeric'})};
  }
  if(period==='year'){
    const y = now.getFullYear() + UI.dashboardYearOffset;
    return {from:`${y}-01-01`, to:`${y}-12-31`, label:String(y)};
  }
  return {from:'0000-01-01', to:'9999-12-31', label:'All time'};
}
function previousPeriodRange(period){
  const now = new Date();
  if(period==='month'){
    const base = new Date(now.getFullYear(), now.getMonth() + UI.dashboardMonthOffset - 1, 1);
    const from = localISODate(base);
    const to = localISODate(new Date(base.getFullYear(), base.getMonth()+1, 0));
    return {from, to, label: base.toLocaleDateString('en-GB',{month:'long', year:'numeric'})};
  }
  if(period==='year'){
    const y = now.getFullYear() + UI.dashboardYearOffset - 1;
    return {from:`${y}-01-01`, to:`${y}-12-31`, label:String(y)};
  }
  return null;
}

/* ---------- utils: escaping ---------- */
function escHTML(s){ return String(s??'').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
function escAttr(s){ return escHTML(s); }

/* ---------- toast ---------- */
function toast(msg, type, opts){
  opts = opts || {};
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='error' ? ' error' : '');
  const span = document.createElement('span');
  span.style.flex = '1';
  span.textContent = msg;
  el.appendChild(span);
  let dismissed = false;
  function dismiss(){
    if(dismissed) return;
    dismissed = true;
    el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250);
  }
  if(opts.actionLabel && opts.onAction){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toast-action';
    btn.textContent = opts.actionLabel;
    btn.onclick = ()=>{ dismiss(); opts.onAction(); };
    el.appendChild(btn);
  }
  host.appendChild(el);
  setTimeout(dismiss, opts.duration || 2600);
}

/* ---------- modal ---------- */
function openModal(html, opts){
  opts = opts || {};

  host.innerHTML = `<div class="modal-overlay" id="modal-overlay"><div class="modal ${opts.wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;

    if(e.target.id==='modal-overlay') closeModal();
  });
  document.addEventListener('keydown', escCloseOnce);
}
function escCloseOnce(e){ if(e.key==='Escape'){ closeModal(); } }
function closeModal(){
  document.getElementById('modal-host').innerHTML = '';
  document.removeEventListener('keydown', escCloseOnce);
}

// Generic one-shot undo for bulk actions. Only the most recent bulk action
// is remembered — a fresh one simply replaces it rather than building a full
// history stack, which keeps this simple and matches what the "Undo" toast
// button can realistically offer anyway (undoing three actions ago via a
// toast that's long since disappeared isn't a real workflow).
function pushUndo(label, restoreFn){
  UI.lastUndo = {label, restore:restoreFn};
}
function offerUndo(message){
  if(!UI.lastUndo) { toast(message); return; }
  const label = UI.lastUndo.label;
  toast(message, null, {
    actionLabel: 'Undo',
    duration: 7000,
    onAction: ()=>{
      if(!UI.lastUndo) return;
      UI.lastUndo.restore();
      UI.lastUndo = null;
      scheduleSave(); renderContent(); renderSidebarBits();
      toast(`Undone: ${label}`);
    },
  });
}

function compareStatHTML(label, current, previous, higherIsGood){
  const delta = current - previous;
  const pct = previous>0.004 ? Math.round(delta/previous*100) : (current>0.004 ? null : 0);
  const good = higherIsGood ? delta>=0 : delta<=0;
  const deltaColor = Math.abs(delta)<0.005 ? 'var(--ink-faint)' : (good ? 'var(--income)' : 'var(--expense)');
  const pctLabel = pct===null ? 'new' : `${delta>=0?'+':''}${pct}%`;
  return `<div class="compare-stat">
    <div class="compare-stat-lbl">${label}</div>
    <div class="compare-stat-val num">${gbp(current)}</div>
    <div class="compare-stat-delta" style="color:${deltaColor}">${delta>=0?'▲':'▼'} ${gbp(Math.abs(delta))} (${pctLabel})</div>
  </div>`;
}

function computeSavingsOpportunities(list, range){
  const periodStart = new Date(range.from+'T00:00:00');
  const expandedList = expandSplits(list);
  const results = [];
  DB.discretionaryCategories.forEach(catName=>{
    if(!DB.categories.some(c=>c.name===catName)) return;
    const current = expandedList.filter(t=> t.category===catName && t.amount<0 && countsTowardTotals(t)).reduce((s,t)=> s+Math.abs(t.amount), 0);
    const monthlyTotals = [];
    for(let i=1;i<=3;i++){
      const base = new Date(periodStart.getFullYear(), periodStart.getMonth()-i, 1);
      const from = localISODate(base);
      const to = localISODate(new Date(base.getFullYear(), base.getMonth()+1, 0));
      const monthSpend = expandSplits(txInRange(from,to))
        .filter(t=> t.category===catName && t.amount<0 && countsTowardTotals(t))
        .reduce((s,t)=> s+Math.abs(t.amount), 0);
      if(monthSpend>0) monthlyTotals.push(monthSpend);
    }
    if(!monthlyTotals.length) return;
    const average = monthlyTotals.reduce((s,v)=>s+v,0) / monthlyTotals.length;
    results.push({ category:catName, current, average, diff: current-average, monthsOfHistory: monthlyTotals.length });
  });
  return results.sort((a,b)=> b.diff-a.diff);
}
function monthPaceInfo(range){
  const from = new Date(range.from+'T00:00:00');
  const to = new Date(range.to+'T00:00:00');
  const today = new Date(todayISO()+'T00:00:00');
  const totalDays = Math.round((to-from)/86400000)+1;
  let elapsedDays;
  if(today < from) elapsedDays = 0;
  else if(today > to) elapsedDays = totalDays;
  else elapsedDays = Math.round((today-from)/86400000)+1;
  return { totalDays, elapsedDays, pacePct: totalDays>0 ? (elapsedDays/totalDays*100) : 0 };
}
// A "pending card" is a running total, not a log of individual purchases —
// you check your credit card app and enter the current total it shows,
// which replaces whatever was there before (it does NOT add up entry by
// entry). That matches how a card's own app already presents it, and means
// updating is a single quick number entry rather than itemising every
// purchase. Cards live in their own list, never in DB.transactions, so
// nothing that touches balance, income, expense totals, investments, or any
// chart can ever see them — only the budget bars (which explicitly opt in)
// do. They only apply to the month you're actually in right now, not one
// you've navigated back to, since a "current total" only means something
// for a cycle that's still open. Once the real card payment is imported,
// set the card back to £0 (or delete it) so the next cycle starts clean.
function pendingForCategory(catName, isLiveMonth){
  if(!isLiveMonth) return 0;
  return DB.pendingCards.filter(c=>c.category===catName).reduce((s,c)=>s+c.amount, 0);
}
function renderBudgets(list, budgetEntries, range){
  const host = document.getElementById('budget-list');
  if(!host) return;
  const expandedList = expandSplits(list);
  const pace = range ? monthPaceInfo(range) : null;
  const isLiveMonth = UI.dashboardMonthOffset===0;
  const rows = budgetEntries.map(([catName, limit])=>{
    const spent = expandedList.filter(t=> t.category===catName && t.amount<0 && countsTowardTotals(t)).reduce((s,t)=> s+Math.abs(t.amount), 0);
    const pending = pendingForCategory(catName, isLiveMonth);
    const combined = spent + pending;
    const pct = limit>0 ? Math.min(999, Math.round(combined/limit*100)) : 0;
    const spentPct = limit>0 ? Math.min(100, spent/limit*100) : 0;
    const pendingPct = limit>0 ? Math.max(0, Math.min(100-spentPct, pending/limit*100)) : 0;
    const color = pct>=100 ? 'var(--expense)' : (pct>=80 ? 'var(--gold)' : 'var(--income)');
    let paceHTML = '';
    if(pace && pct<100){
      const paceDiff = pct - pace.pacePct;
      let paceLabel, paceColor;
      if(paceDiff > 15){ paceLabel = `running ${Math.round(paceDiff)}pts ahead of pace`; paceColor = 'var(--expense)'; }
      else if(paceDiff < -15){ paceLabel = 'well under pace'; paceColor = 'var(--income)'; }
      else { paceLabel = 'on pace'; paceColor = 'var(--ink-faint)'; }
      paceHTML = `<span style="color:${paceColor};"> · ${paceLabel}</span>`;
    }
    const paceMarker = pace ? `<div style="position:absolute;left:${Math.min(100,pace.pacePct)}%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.45;" title="${Math.round(pace.pacePct)}% of the month has passed (day ${pace.elapsedDays} of ${pace.totalDays})"></div>` : '';
    const pendingSegment = pendingPct>0.5 ? `<div style="position:absolute;left:${spentPct}%;top:0;bottom:0;width:${pendingPct}%;background:repeating-linear-gradient(45deg, ${color}, ${color} 3px, transparent 3px, transparent 6px);opacity:.65;" title="${gbp(pending)} pending on card — not counted in your balance yet"></div>` : '';
    return `<div class="budget-row">
      <div class="budget-row-top">
        <span class="budget-name">${escHTML(catName)}</span>
        <span class="budget-figures num">${gbp(spent)}${pending>0.005?` <span style="color:var(--ink-faint);">+ ${gbp(pending)} on card</span>`:''} <span style="color:var(--ink-faint);">/ ${gbp(limit)}</span></span>
      </div>
      <div class="budget-bar-track" style="position:relative;">
        <div class="budget-bar-fill" style="width:${spentPct}%; background:${color};"></div>
        ${pendingSegment}
        ${paceMarker}
      </div>
      <div class="budget-pct" style="color:${color};">${pct}% ${pct>=100?'over budget':'used'}${paceHTML}</div>
    </div>`;
  }).join('');
  host.innerHTML = `<div class="budget-grid">${rows}</div>${pace ? `<p style="font-size:11px;color:var(--ink-faint);margin:10px 2px 0;">The dark marker on each bar shows where you'd be if spending were spread evenly across the month — you're ${Math.round(pace.pacePct)}% through it (day ${pace.elapsedDays} of ${pace.totalDays}). Striped segments are your cards' current pending totals, not yet in your balance.</p>` : ''}`;
}

function trendBuckets(gran){
  gran = gran || UI.trendGran;
  const now = todayISO();
  const buckets = [];
  if(gran==='week'){
    let start = mondayOf(now);
    for(let i=11;i>=0;i--){
      const from = addDays(start, -7*i);
      const to = addDays(from, 6);
      buckets.push({from, to, label: ukDateShort(from)});
    }
  } else if(gran==='month'){
    for(let i=11;i>=0;i--){
      const from = addMonths(now.slice(0,8)+'01', -i).slice(0,7)+'-01';
      const d = new Date(from+'T00:00:00');
      const to = localISODate(new Date(d.getFullYear(), d.getMonth()+1, 0));
      buckets.push({from, to, label: monthLabel(from.slice(0,7))});
    }
  } else {
    const y = parseInt(now.slice(0,4));
    for(let i=5;i>=0;i--){
      const yr = y-i;
      buckets.push({from:`${yr}-01-01`, to:`${yr}-12-31`, label:String(yr)});
    }
  }
  return buckets;
}

function balanceAt(dateISO){
  const liquidTypes=new Set(['current','savings','cash','credit_card']);
  const names=allAccountNames().filter(name=>liquidTypes.has((accountRecordFor(name)||{}).type||'current'));
  const opening=names.length?names.reduce((sum,name)=>sum+accountOpeningBalance(name),0):((DB.accountRecords||[]).length?0:(Number(DB.startingBalance)||0));
  return opening+DB.transactions.reduce((s,t)=>t.date<=dateISO&&transactionStatus(t)!=='pending'&&(!t.account||names.includes(t.account))?s+t.amount:s,0);
}
function computeForecastBuckets(gran, historicalBuckets, count){
  count = count || 6;
  const last3 = historicalBuckets.slice(-3);
  const nets = last3.map(b=> sumIncome(txInRange(b.from,b.to)) - sumExpense(txInRange(b.from,b.to)));
  const avgNet = nets.length ? nets.reduce((s,v)=>s+v,0)/nets.length : 0;
  let prevTo = historicalBuckets[historicalBuckets.length-1].to;
  let bal = balanceAt(prevTo);
  const out = [];
  for(let i=0;i<count;i++){
    let from, to, label;
    if(gran==='week'){
      from = addDays(prevTo,1); to = addDays(from,6); label = ukDateShort(from);
    } else if(gran==='month'){
      const d = new Date(prevTo+'T00:00:00');
      const nextMonth = new Date(d.getFullYear(), d.getMonth()+1, 1);
      from = localISODate(nextMonth);
      to = localISODate(new Date(nextMonth.getFullYear(), nextMonth.getMonth()+1, 0));
      label = monthLabel(from.slice(0,7));
    } else {
      const y = parseInt(prevTo.slice(0,4))+1;
      from = `${y}-01-01`; to = `${y}-12-31`; label = String(y);
    }
    bal += avgNet;
    out.push({label, balance:bal});
    prevTo = to;
  }
  return out;
}
